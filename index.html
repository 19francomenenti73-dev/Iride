<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>I.R.I.D.E. - Radar Convective Continuous Engine</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --bg-deep: #02060f;
            --panel-bg: rgba(6, 14, 26, 0.95);
            --border-color: #162c46;
            --cyan-glow: #00d2ff;
            --pink-core: #ff0055;
            --text-main: #ffffff;
        }
        * { box-sizing: border-box; touch-action: none; }
        body { margin: 0; padding: 0; background: var(--bg-deep); color: var(--text-main); font-family: 'Segoe UI', system-ui, sans-serif; overflow: hidden; width: 100vw; height: 100vh; }

        #view-tracker { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; display: flex; flex-direction: column; }
        #header-tracker { height: 54px; background: var(--panel-bg); border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; padding: 0 16px; z-index: 10; backdrop-filter: blur(6px); }
        .brand-title { color: var(--cyan-glow); font-weight: 800; font-size: 18px; letter-spacing: 2px; }
        .brand-subtitle { font-size: 11px; color: #8a99ad; margin-left: 10px; }
        #map { flex-grow: 1; width: 100%; height: 100%; z-index: 1; }

        #view-3d { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2000; background: radial-gradient(circle at center, #071325 0%, #020408 100%); display: none; flex-direction: column; }
        #view-3d.active { display: flex; }

        #header-3d { height: 60px; background: var(--panel-bg); border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; padding: 0 16px; z-index: 10; }
        .controls-3d { display: flex; gap: 6px; align-items: center; }
        .btn-mode { background: #091b30; color: var(--cyan-glow); border: 1px solid var(--border-color); padding: 6px 12px; border-radius: 4px; font-weight: bold; font-size: 10px; cursor: pointer; }
        .btn-mode.active { background: #00b4d8; color: #000; border-color: #00b4d8; box-shadow: 0 0 10px rgba(0,180,216,0.5); }
        .btn-back { background: #ff0055; color: #fff; border: none; padding: 6px 12px; border-radius: 4px; font-weight: bold; font-size: 11px; cursor: pointer; }

        #canvas-container-3d { flex-grow: 1; position: relative; width: 100%; height: 100%; overflow: hidden; }
        #canvas-cell-3d { width: 100% !important; height: 100% !important; display: block; }

        .telemetry-overlay { position: absolute; bottom: 20px; right: 20px; background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 12px 16px; font-size: 11px; backdrop-filter: blur(8px); min-width: 250px; pointer-events: none; }
        .tele-row { display: flex; justify-content: space-between; margin-bottom: 4px; color: #94a3b8; }
        .tele-val { color: #fff; font-weight: bold; }
    </style>
</head>
<body>
    <div id="view-tracker">
        <div id="header-tracker">
            <div style="display: flex; align-items: baseline;">
                <div class="brand-title">I.R.I.D.E.</div>
                <div class="brand-subtitle">Real-Time Convective Tracker</div>
            </div>
            <div style="font-size: 11px; color: #00ff66; font-weight: bold; background: #091b30; padding: 5px 10px; border-radius: 4px; border: 1px solid var(--border-color);">● TRACKER ATTIVO</div>
        </div>
        <div style="position: relative; flex-grow: 1; width: 100%; height: 100%;"><div id="map"></div></div>
    </div>

    <div id="view-3d">
        <div id="header-3d">
            <div style="display: flex; align-items: center; gap: 12px;">
                <button class="btn-back" onclick="closeCell3DView()">← INDIETRO MAPPA</button>
                <div>
                    <div id="h-core-id" style="font-weight: bold; font-size: 14px; color: var(--cyan-glow);">Core-Cell</div>
                    <div style="font-size: 9px; color: #8a99ad;">Continuous Volumetric Supercell Engine</div>
                </div>
            </div>
            <div class="controls-3d">
                <button class="btn-mode active" id="bm-solid" onclick="switchCellMode('solid')">SOLIDO 3D</button>
                <button class="btn-mode" id="bm-iso" onclick="switchCellMode('iso')">ISOVOLUMETRICO</button>
                <button class="btn-mode" id="bm-holo" onclick="switchCellMode('holo')">HOLO</button>
            </div>
        </div>
        <div id="canvas-container-3d">
            <canvas id="canvas-cell-3d"></canvas>
            <div class="telemetry-overlay">
                <div class="tele-row"><span>Riflettività Max:</span> <span id="t-dbz" class="tele-val" style="color:var(--pink-core);">--</span></div>
                <div class="tele-row"><span>Velocità / Dir:</span> <span id="t-vel" class="tele-val">--</span></div>
                <div class="tele-row"><span>VIL / Echo Top:</span> <span id="t-vil" class="tele-val">--</span></div>
            </div>
        </div>
    </div>
        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const map = L.map('map', { zoomControl: false, attributionControl: false }).setView([42.0, 12.5], 6);
        L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', { maxZoom: 17 }).addTo(map);

        let activeCellData = null;
        let currentCellMode = 'solid';

        const jsonUrl = window.location.hostname.includes('github.io') ? '/Nowcasting_Italia/data/iride_database.json' : 'data/iride_database.json';

        fetch(jsonUrl)
            .then(res => res.ok ? res.json() : Promise.reject())
            .then(data => {
                if (data?.radar_tile_path) L.tileLayer(`https://tilecache.rainviewer.com${data.radar_tile_path}/256/{z}/{x}/{y}/2/1_1.png`, { opacity: 0.75 }).addTo(map);
                if (data?.cells?.length > 0) renderCentroids(data.cells);
            })
            .catch(() => {
                renderCentroids([{ id: "Core-51611", lat: 41.89, lon: 12.50, max_dbz: 68.4, kinematics: { velocity_kmh: 58, direction_deg: 278 }, severity: { vil: 32.7, echo_top: 16.8 } }]);
            });

        function renderCentroids(cells) {
            cells.forEach(cell => {
                const icon = L.divIcon({ html: `<div style="width:28px; height:28px; border:2px solid #ff0055; border-radius:50%; background:rgba(255,0,85,0.3); display:flex; align-items:center; justify-content:center;"><div style="width:8px; height:8px; background:#ff0055; border-radius:50%;"></div></div>`, iconSize: [28, 28] });
                const marker = L.marker([cell.lat, cell.lon], { icon }).addTo(map);
                marker.on('click', () => openCell3DView(cell));
            });
        }

        function openCell3DView(cell) {
            activeCellData = cell;
            document.getElementById('h-core-id').innerText = cell.id;
            document.getElementById('t-dbz').innerText = (cell.max_dbz || 0) + " dBZ";
            document.getElementById('t-vel').innerText = `${cell.kinematics?.velocity_kmh || 0} km/h (${cell.kinematics?.direction_deg || 0}°)`;
            document.getElementById('t-vil').innerText = `${cell.severity?.vil || 0} kg/m² | ${cell.severity?.echo_top || 0} km`;
            document.getElementById('view-3d').classList.add('active');
            setTimeout(initCell3DEngine, 50);
        }

        function closeCell3DView() { document.getElementById('view-3d').classList.remove('active'); }

        function switchCellMode(mode) {
            currentCellMode = mode;
            document.querySelectorAll('.btn-mode').forEach(b => b.classList.remove('active'));
            document.getElementById(`bm-${mode}`).classList.add('active');
            if (cellScene && cellRootGroup) {
                cellScene.remove(cellRootGroup);
                cellRootGroup = buildContinuousSupercell(currentCellMode);
                cellScene.add(cellRootGroup);
            }
        }

        let cellRenderer, cellScene, cellCamera, cellRootGroup;
        let isDragging = false, prevMouse = { x: 0, y: 0 };
        let rotY = 0, tiltX = 0.35;

        function initCell3DEngine() {
            const canvas = document.getElementById('canvas-cell-3d');
            const container = document.getElementById('canvas-container-3d');
            if (cellRenderer) return;

            cellRenderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
            cellRenderer.setSize(container.clientWidth, container.clientHeight);
            cellRenderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

            cellScene = new THREE.Scene();
            cellCamera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
            cellCamera.position.set(0, 16, 40);
            cellCamera.lookAt(0, 3, 0);

            cellScene.add(new THREE.AmbientLight(0xffffff, 1.4));
            const light = new THREE.DirectionalLight(0xffffff, 1.6);
            light.position.set(20, 40, 20);
            cellScene.add(light);

            cellRootGroup = buildContinuousSupercell(currentCellMode);
            cellScene.add(cellRootGroup);

            container.addEventListener('pointerdown', e => { isDragging = true; prevMouse = { x: e.clientX, y: e.clientY }; });
            window.addEventListener('pointermove', e => {
                if (!isDragging) return;
                rotY += (e.clientX - prevMouse.x) * 0.008;
                tiltX = Math.max(0.1, Math.min(0.65, tiltX + (e.clientY - prevMouse.y) * 0.008));
                if (cellRootGroup) { cellRootGroup.rotation.y = rotY; cellRootGroup.rotation.x = tiltX; }
                prevMouse = { x: e.clientX, y: e.clientY };
            });
            window.addEventListener('pointerup', () => { isDragging = false; });
            animateCell3D();
        }

        function getDbzColor(dbz) {
            if (dbz >= 65) return 0xff00ff; // Magenta
            if (dbz >= 58) return 0xff0055; // Rosso
            if (dbz >= 50) return 0xff3300; // Arancione scuro
            if (dbz >= 42) return 0xff9900; // Arancione
            if (dbz >= 35) return 0xffff00; // Giallo
            if (dbz >= 28) return 0x00ff66; // Verde
            return 0x00b4d8; // Azzurro
        }

        // COSTRUZIONE SUPERCELLA CONTINUA (Forma organica a fungo senza mattoncini staccati)
        function buildContinuousSupercell(mode) {
            const master = new THREE.Group();
            master.rotation.x = tiltX;
            master.rotation.y = rotY;

            // Base Radar 2D piatta in basso
            const ring = new THREE.RingGeometry(1, 15, 32);
            ring.rotateX(-Math.PI / 2);
            const baseMesh = new THREE.Mesh(ring, new THREE.MeshBasicMaterial({ color: 0x00d2ff, wireframe: true, transparent: true, opacity: 0.3 }));
            baseMesh.position.y = -2.5;
            master.add(baseMesh);

            const steps = 30; // Numero di strati verticali per una transizione fluida
            const totalHeight = 11;

            for (let i = 0; i <= steps; i++) {
                let hRatio = i / steps; // da 0 (base) a 1 (cima)
                let yPos = (hRatio * totalHeight) - 2;

                // Profilo morfologico a fungo: raggio stretto in basso (gambo), largo in alto (incudine)
                let radius = hRatio < 0.35 
                    ? 1.2 + (hRatio * 2.0)                          // Gambo stretto
                    : 1.9 + Math.pow((hRatio - 0.35) / 0.65, 1.4) * 9.5; // Incudine che esplode in ampiezza

                // Riflettività decrescente salendo verso l'incudine
                let simulatedDbz = 72 - (hRatio * 38);
                let layerColor = getDbzColor(simulatedDbz);

                let geom = new THREE.CylinderGeometry(radius * 0.92, radius, totalHeight / steps + 0.02, 32, 1, false);
                
                let mat;
                if (mode === 'solid') {
                    mat = new THREE.MeshStandardMaterial({
                        color: layerColor,
                        roughness: 0.25,
                        metalness: 0.1,
                        transparent: true,
                        opacity: 0.78,
                        side: THREE.DoubleSide
                    });
                } else if (mode === 'iso') {
                    mat = new THREE.MeshPhysicalMaterial({
                        color: layerColor,
                        roughness: 0.2,
                        transmission: 0.65,
                        transparent: true,
                        opacity: 0.6,
                        side: THREE.DoubleSide
                    });
                } else {
                    mat = new THREE.MeshBasicMaterial({
                        color: layerColor,
                        wireframe: true,
                        transparent: true,
                        opacity: 0.55
                    });
                }

                let layerMesh = new THREE.Mesh(geom, mat);
                layerMesh.position.y = yPos;
                master.add(layerMesh);
            }

            return master;
        }

        function animateCell3D() {
            requestAnimationFrame(animateCell3D);
            if (!isDragging && document.getElementById('view-3d').classList.contains('active')) {
                rotY += 0.003;
                if (cellRootGroup) cellRootGroup.rotation.y = rotY;
            }
            if (cellRenderer && cellScene && cellCamera) cellRenderer.render(cellScene, cellCamera);
        }
    </script>
</body>
</html>
