<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>I.R.I.D.E. — Convective Volume</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#030913;color:#eaf5ff;font:14px system-ui,sans-serif}
header{padding:12px;background:#081525;border-bottom:1px solid #17334c}
h1{font-size:18px;margin:0 0 4px}
p{margin:4px 0;color:#9eb4c9}
#controls{display:flex;gap:7px;flex-wrap:wrap;padding:10px}
button,select{background:#0c2238;color:#dff6ff;border:1px solid #1b4b68;border-radius:7px;padding:9px}
button:active{background:#007d9b}
#stage{height:66vh;min-height:400px;position:relative}
canvas{display:block;width:100%;height:100%;touch-action:pan-y}
#info{padding:12px;margin:8px;background:#081525;border:1px solid #17334c;border-radius:10px}
.small{font-size:12px;color:#9eb4c9}
</style>
</head>
<body>
<header>
<h1>I.R.I.D.E. — Ricostruzione convettiva 3D</h1>
<p>Volume pseudo-3D derivato dalla matrice DBZH</p>
</header>
<div id="controls">
<button id="left">↶ Ruota</button>
<button id="right">Ruota ↷</button>
<button id="tilt">Inclina</button>
<button id="reset">Reset vista</button>
<select id="mode">
<option value="volume">Volume pieno</option>
<option value="anvil">Solo incudine</option>
<option value="core">Solo core</option>
</select>
</div>
<div id="stage"><canvas id="view"></canvas></div>
<div id="info">
<strong id="status">Caricamento matrice radar…</strong>
<p id="metrics"></p>
<p class="small">Le quote e le fasce volumetriche sono stimate dal modello;
non rappresentano misure dirette dell'altezza della nube.</p>
</div>

<script type="module">
import * as THREE from
'https://unpkg.com/three@0.160.0/build/three.module.js';

const canvas=document.querySelector('#view');
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x030913);

const camera=new THREE.PerspectiveCamera(42,1,0.1,1000);
camera.position.set(0,24,48);

const renderer=new THREE.WebGLRenderer({
 canvas,antialias:true,alpha:false
});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.setSize(canvas.clientWidth,canvas.clientHeight,false);
renderer.outputColorSpace=THREE.SRGBColorSpace;

scene.add(new THREE.AmbientLight(0xffffff,1.5));
const light=new THREE.DirectionalLight(0xffffff,2);
light.position.set(-10,30,20);
scene.add(light);

const root=new THREE.Group();
scene.add(root);

let matrix=[],objects=[];
let rotation=0,tilt=0.48,drag=null;
let mode='volume';
let maxDbz=0,minDbz=0;
const grid=new THREE.GridHelper(40,20,0x163c57,0x0b2236);
grid.position.y=-0.2;
scene.add(grid);

function colorFor(v){
 if(v>=50)return 0xff00dc;
 if(v>=45)return 0xff1744;
 if(v>=40)return 0xff6528;
 if(v>=35)return 0xffe83c;
 if(v>=30)return 0x27dc65;
 if(v>=20)return 0x00cce8;
 return 0x075bff;
}

function clearVolume(){
 for(const obj of objects){
  root.remove(obj);
  obj.geometry?.dispose();
  obj.material?.dispose();
 }
 objects=[];
}

function dilate(mask,radius){
 const h=mask.length,w=mask[0].length;
 const out=Array.from({length:h},()=>Array(w).fill(false));
 for(let y=0;y<h;y++){
  for(let x=0;x<w;x++){
   if(!mask[y][x])continue;
   for(let dy=-radius;dy<=radius;dy++){
    for(let dx=-radius;dx<=radius;dx++){
     if(dx*dx+dy*dy>radius*radius)continue;
     const yy=y+dy,xx=x+dx;
     if(yy>=0&&yy<h&&xx>=0&&xx<w)out[yy][xx]=true;
    }
   }
  }
 }
 return out;
}

function buildVolume(){
 clearVolume();
 if(!matrix.length)return;

 const h=matrix.length,w=matrix[0].length;
 const step=Math.max(0.22,28/Math.max(h,w));
 const cells=[];

 for(let y=0;y<h;y++){
  for(let x=0;x<w;x++){
   const v=matrix[y][x];
   if(v!==null&&Number.isFinite(v)&&v>=20){
    cells.push({x,y,v});
   }
  }
 }
 if(!cells.length){
  document.querySelector('#status').textContent=
   'Nessun eco DBZH valido sopra 20 dBZ.';
  return;
 }

 const strong=Array.from({length:h},()=>Array(w).fill(false));
 for(const c of cells)if(c.v>=35)strong[c.y][c.x]=true;

 // Le maschere dilatate rappresentano la ricostruzione dell'incudine.
 // Non sono pixel radar aggiuntivi osservati.
 const radius=Math.max(2,Math.round(Math.min(h,w)*0.035));
 const anvil=dilate(strong,radius);
 const green=dilate(strong,Math.max(1,Math.round(radius*0.7)));

 function addCube(x,y,z,v,size,opacity=1){
  const geo=new THREE.BoxGeometry(size,size,size);
  const mat=new THREE.MeshStandardMaterial({
   color:colorFor(v),roughness:0.72,metalness:0,
   transparent:opacity<1,opacity
  });
  const mesh=new THREE.Mesh(geo,mat);
  mesh.position.set((x-w/2)*step,z,(y-h/2)*step);
  root.add(mesh);
  objects.push(mesh);
 }

 if(mode!=='core'){
  // Incudine: strato alto, sottile, più largo del core.
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
   if(!anvil[y][x])continue;
   const v=matrix[y][x];
   const local=(v!==null&&Number.isFinite(v))?v:22;
   const isCore=strong[y][x];
   if(isCore)continue;
   if(mode==='anvil'&&!anvil[y][x])continue;
   addCube(x,y,7,local,step*0.98,0.86);
   if(green[y][x])addCube(x,y,5,30,step*0.94,0.9);
  }
 }

 if(mode!=='anvil'){
  for(const c of cells){
   if(c.v<30)continue;

   // Inversione verticale: dBZ maggiore = livello più basso.
   // La funzione è una scelta parametrica del modello.
   const z=c.v>=50?1.2:c.v>=45?1.8:c.v>=40?2.5:
           c.v>=35?3.2:c.v>=30?4.1:5;

   // Core colorato e pieno; non viene disegnato come reticolo.
   addCube(c.x,c.y,z,c.v,step*1.02,1);

   // Colonna inferiore compatta sotto il nucleo intenso.
   if(c.v>=40){
    addCube(c.x,c.y,0.7,c.v,step*0.9,1);
    if(c.v>=45)addCube(c.x,c.y,1.0,c.v,step*0.92,1);
   }
  }
 }

 const maxExtent=Math.max(w,h)*step/2;
 camera.position.set(0,maxExtent*0.95,maxExtent*2.25);
 camera.lookAt(0,3,0);

 document.querySelector('#status').textContent=
  `${cells.length} pixel DBZH utilizzati · volume ricostruito`;
 document.querySelector('#metrics').textContent=
  `DBZH ${minDbz.toFixed(1)}–${maxDbz.toFixed(1)} dBZ · `+
  `${h} × ${w} celle nella matrice`;
}

function resize(){
 const w=canvas.clientWidth,h=canvas.clientHeight;
 if(!w||!h)return;
 renderer.setSize(w,h,false);
 camera.aspect=w/h;
 camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(canvas);

function animate(){
 requestAnimationFrame(animate);
 root.rotation.y=rotation;
 root.rotation.x=tilt;
 renderer.render(scene,camera);
}
animate();

document.querySelector('#left').onclick=()=>rotation-=0.18;
document.querySelector('#right').onclick=()=>rotation+=0.18;
document.querySelector('#tilt').onclick=()=>{
 tilt=tilt>=0.9?0.2:tilt+0.18;
};
document.querySelector('#reset').onclick=()=>{
 rotation=0;tilt=0.48;
};
document.querySelector('#mode').onchange=e=>{
 mode=e.target.value;buildVolume();
};

canvas.addEventListener('pointerdown',e=>{
 drag={x:e.clientX,y:e.clientY};
 canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove',e=>{
 if(!drag)return;
 rotation+=(e.clientX-drag.x)*0.008;
 tilt=Math.max(0.05,Math.min(1.25,
  tilt+(e.clientY-drag.y)*0.004));
 drag={x:e.clientX,y:e.clientY};
});
canvas.addEventListener('pointerup',()=>drag=null);
canvas.addEventListener('pointercancel',()=>drag=null);

async function load(){
 try{
  const response=await fetch(`data/iride.json?v=${Date.now()}`);
  if(!response.ok)throw Error(`HTTP ${response.status}`);
  const data=await response.json();
  if(!Array.isArray(data.matrix_dbzh))throw Error('Matrice DBZH assente');
  matrix=data.matrix_dbzh;
  maxDbz=Number(data.dbzh_max)||0;
  minDbz=Number(data.dbzh_min)||0;
  buildVolume();
 }catch(error){
  document.querySelector('#status').textContent=
   `Errore caricamento: ${error.message}`;
 }
}
load();
</script>
</body>
</html>
