<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>I.R.I.D.E. - Italian Radar Interactive Deep Engine</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --bg-deep: #02060f;
            --panel-bg: rgba(6, 14, 26, 0.95);
            --border-color: #162c46;
            --cyan-glow: #00d2ff;
            --pink-core: #ff0055;
            --text-main: #ffffff;
        }
        * { box-sizing: border-box; touch-action: none; }
        body { margin: 0; padding: 0; background: var(--bg-deep); color: var(--text-main); font-family: 'Segoe UI', system-ui, sans-serif; overflow: hidden; width: 100vw; height: 100vh; }

        #view-tracker { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; display: flex; flex-direction: column; }
        #header-tracker { height: 54px; background: var(--panel-bg); border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; padding: 0 16px; z-index: 10; backdrop-filter: blur(6px); }
        .brand-title { color: var(--cyan-glow); font-weight: 800; font-size: 18px; letter-spacing: 2px; }
        .brand-subtitle { font-size: 11px; color: #8a99ad; margin-left: 10px; }
        #map { flex-grow: 1; width: 100%; height: 100%; z-index: 1; }

        .dbz-scale-bar { position: absolute; bottom: 20px; left: 20px; z-index: 1000; background: var(--panel-bg); border: 1px solid var(--border-color); padding: 8px 10px; border-radius: 6px; font-size: 10px; backdrop-filter: blur(4px); }
        .dbz-gradient { width: 14px; height: 140px; background: linear-gradient(to top, #00b4d8, #00ff66, #ffff00, #ff9900, #ff0055, #ff00ff, #ffffff); margin-top: 4px; border-radius: 2px; }

        #view-3d { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2000; background: radial-gradient(circle at center, #071325 0%, #020408 100%); display: none; flex-direction: column; }
        #view-3d.active { display: flex; }

        #header-3d { height: 60px; background: var(--panel-bg); border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; padding: 0 16px; z-index: 10; }
        .controls-3d { display: flex; gap: 6px; align-items: center; }
        .btn-mode { background: #091b30; color: var(--cyan-glow); border: 1px solid var(--border-color); padding: 6px 12px; border-radius: 4px; font-weight: bold; font-size: 10px; cursor: pointer; }
        .btn-mode.active { background: #00b4d8; color: #000; border-color: #00b4d8; box-shadow: 0 0 10px rgba(0,180,216,0.5); }
        .btn-back { background: #ff0055; color: #fff; border: none; padding: 6px 12px; border-radius: 4px; font-weight: bold; font-size: 11px; cursor: pointer; }

        #canvas-container-3d { flex-grow: 1; position: relative; width: 100%; height: 100%; overflow: hidden; }
        #canvas-cell-3d { width: 100% !important; height: 100% !important; display: block; }

        .telemetry-overlay { position: absolute; bottom: 20px; right: 20px; background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 12px 16px; font-size: 11px; backdrop-filter: blur(8px); min-width: 250px; pointer-events: none; }
        .tele-row { display: flex; justify-content: space-between; margin-bottom: 4px; color: #94a3b8; }
        .tele-val { color: #fff; font-weight: bold; }
    </style>
</head>
<body>
    <div id="view-tracker">
        <div id="header-tracker">
            <div style="display: flex; align-items: baseline;">
                <div class="brand-title">I.R.I.D.E.</div>
                <div class="brand-subtitle">Real-Time Convective Tracker</div>
            </div>
            <div style="font-size: 11px; color: #00ff66; font-weight: bold; background: #091b30; padding: 5px 10px; border-radius: 4px; border: 1px solid var(--border-color);">● TRACKER ATTIVO</div>
        </div>
        <div style="position: relative; flex-grow: 1; width: 100%; height: 100%;">
            <div id="map"></div>
            <div class="dbz-scale-bar">
                <div style="font-weight: bold; margin-bottom: 2px;">Riflettività (dBZ)</div>
                <div style="display: flex; justify-content: space-between; font-size: 9px; color: #aaa;"><span>75</span><span>10</span></div>
                <div class="dbz-gradient"></div>
            </div>
        </div>
    </div>

    <div id="view-3d">
        <div id="header-3d">
            <div style="display: flex; align-items: center; gap: 12px;">
                <button class="btn-back" onclick="closeCell3DView()">← INDIETRO MAPPA</button>
                <div>
                    <div id="h-core-id" style="font-weight: bold; font-size: 14px; color: var(--cyan-glow);">Core-Cell</div>
                    <div style="font-size: 9px; color: #8a99ad;">Continuous Organic 3D Storm Engine</div>
                </div>
            </div>
            <div class="controls-3d">
                <button class="btn-mode active" id="bm-solid" onclick="switchCellMode('solid')">SOLIDO 3D</button>
                <button class="btn-mode" id="bm-iso" onclick="switchCellMode('iso')">ISOVOLUMETRICO</button>
                <button class="btn-mode" id="bm-holo" onclick="switchCellMode('holo')">HOLO</button>
            </div>
        </div>
        <div id="canvas-container-3d">
            <canvas id="canvas-cell-3d"></canvas>
            <div class="telemetry-overlay">
                <div class="tele-row"><span>Riflettività Max:</span> <span id="t-dbz" class="tele-val" style="color:var(--pink-core);">--</span></div>
                <div class="tele-row"><span>Velocità / Dir:</span> <span id="t-vel" class="tele-val">--</span></div>
                <div class="tele-row"><span>VIL / Echo Top:</span> <span id="t-vil" class="tele-val">--</span></div>
            </div>
        </div>
    </div>
        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const map = L.map('map', { zoomControl: false, attributionControl: false }).setView([42.0, 12.5], 6);
        L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', { maxZoom: 17 }).addTo(map);

        let activeCellData = null;
        let currentCellMode = 'solid';

        const pathSegments = window.location.pathname.split('/').filter(Boolean);
        const jsonUrl = window.location.hostname.includes('github.io') && pathSegments.length > 0 
            ? `/${pathSegments[0]}/data/iride_database.json` 
            : 'data/iride_database.json';

        fetch(jsonUrl)
            .then(res => res.ok ? res.json() : Promise.reject('JSON non trovato'))
            .then(data => {
                if (data?.radar_tile_path) {
                    L.tileLayer(`https://tilecache.rainviewer.com${data.radar_tile_path}/256/{z}/{x}/{y}/2/1_1.png`, {
                        opacity: 0.75, maxZoom: 18
                    }).addTo(map);
                }
                if (data?.cells && data.cells.length > 0) {
                    renderCentroids(data.cells);
                }
            })
            .catch(err => {
                console.warn("[I.R.I.D.E.] In attesa dati JSON reali:", err);
            });

        function renderCentroids(cells) {
            cells.forEach(cell => {
                const icon = L.divIcon({
                    className: 'custom-centroid',
                    html: `<div style="width:28px; height:28px; border:2px solid #ff0055; border-radius:50%; animation: pulse 1.4s infinite; background: rgba(255,0,85,0.3); display:flex; align-items:center; justify-content:center;"><div style="width:8px; height:8px; background:#ff0055; border-radius:50%;"></div></div>`,
                    iconSize: [28, 28]
                });
                const marker = L.marker([cell.lat, cell.lon], { icon }).addTo(map);
                marker.on('click', () => openCell3DView(cell));

                if (cell.vectors?.real) L.polyline(cell.vectors.real, { color: '#00d2ff', weight: 2, dashArray: '4,4' }).addTo(map);
                if (cell.vectors?.predictive_noaa) L.polyline(cell.vectors.predictive_noaa, { color: '#ff0055', weight: 1.5 }).addTo(map);
            });
        }

        function openCell3DView(cell) {
            activeCellData = cell;
            document.getElementById('h-core-id').innerText = cell.id || "Core-Cell";
            document.getElementById('t-dbz').innerText = (cell.max_dbz || 0) + " dBZ";
            document.getElementById('t-vel').innerText = `${cell.kinematics?.velocity_kmh || 0} km/h (${cell.kinematics?.direction_deg || 0}°)`;
            document.getElementById('t-vil').innerText = `${cell.severity?.vil || 0} kg/m² | ${cell.severity?.echo_top || 0} km`;
            document.getElementById('view-3d').classList.add('active');
            setTimeout(initCell3DEngine, 50);
        }

        function closeCell3DView() {
            document.getElementById('view-3d').classList.remove('active');
        }

        function switchCellMode(mode) {
            currentCellMode = mode;
            document.querySelectorAll('.btn-mode').forEach(b => b.classList.remove('active'));
            if (mode === 'solid') document.getElementById('bm-solid').classList.add('active');
            if (mode === 'iso') document.getElementById('bm-iso').classList.add('active');
            if (mode === 'holo') document.getElementById('bm-holo').classList.add('active');

            if (cellScene && cellRootGroup) {
                cellScene.remove(cellRootGroup);
                cellRootGroup = buildContinuousSmoothStorm(activeCellData?.grid_matrix, currentCellMode);
                cellScene.add(cellRootGroup);
            }
        }

        let cellRenderer = null, cellScene = null, cellCamera = null, cellRootGroup = null;
        let isDragging = false, prevMouse = { x: 0, y: 0 };
        let rotY = 0, tiltX = 0.38;

        function initCell3DEngine() {
            const canvas = document.getElementById('canvas-cell-3d');
            const container = document.getElementById('canvas-container-3d');
            const width = container.clientWidth;
            const height = container.clientHeight;

            if (cellRenderer) {
                cellRenderer.setSize(width, height);
                cellCamera.aspect = width / height;
                cellCamera.updateProjectionMatrix();
                return;
            }

            cellRenderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
            cellRenderer.setSize(width, height);
            cellRenderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

            cellScene = new THREE.Scene();
            cellCamera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
            cellCamera.position.set(0, 22, 40);
            cellCamera.lookAt(0, 1, 0);

            cellScene.add(new THREE.AmbientLight(0xffffff, 1.4));
            const light = new THREE.DirectionalLight(0xffffff, 1.6);
            light.position.set(20, 40, 20);
            cellScene.add(light);

            cellRootGroup = buildContinuousSmoothStorm(activeCellData?.grid_matrix, currentCellMode);
            cellScene.add(cellRootGroup);

            container.addEventListener('pointerdown', (e) => {
                isDragging = true;
                prevMouse = { x: e.clientX, y: e.clientY };
            });

            window.addEventListener('pointermove', (e) => {
                if (!isDragging || !document.getElementById('view-3d').classList.contains('active')) return;
                const dx = e.clientX - prevMouse.x;
                const dy = e.clientY - prevMouse.y;

                rotY += dx * 0.008;
                tiltX = Math.max(0.1, Math.min(0.68, tiltX + dy * 0.008));

                if (cellRootGroup) {
                    cellRootGroup.rotation.y = rotY;
                    cellRootGroup.rotation.x = tiltX;
                }
                prevMouse = { x: e.clientX, y: e.clientY };
            });

            window.addEventListener('pointerup', () => { isDragging = false; });
            window.addEventListener('resize', () => {
                if (!container || !cellRenderer) return;
                const w = container.clientWidth;
                const h = container.clientHeight;
                cellRenderer.setSize(w, h);
                cellCamera.aspect = w / h;
                cellCamera.updateProjectionMatrix();
            });

            animateCell3D();
        }

        function getDbzColorHex(dbz) {
            if (dbz >= 70) return 0xff00ff;
            if (dbz >= 62) return 0xff0055;
            if (dbz >= 55) return 0xff3300;
            if (dbz >= 48) return 0xff9900;
            if (dbz >= 40) return 0xffff00;
            if (dbz >= 35) return 0x00ff66;
            return 0x00b4d8;
        }

        // MOTORE 3D CONTINUO E MORBIDO: Sostituisce i blocchi separati con strati continui fusi e asimmetrici
        function buildContinuousSmoothStorm(matrix, mode) {
            const masterGroup = new THREE.Group();
            masterGroup.rotation.x = tiltX;
            masterGroup.rotation.y = rotY;

            // 1. Base Raster 2D sotto (esatta proiezione della matrice)
            const baseGroup = new THREE.Group();
            baseGroup.position.y = -3.2;

            let rows = 24, cols = 24;
            if (matrix && Array.isArray(matrix)) {
                rows = matrix.length;
                cols = matrix[0].length;
                const pSize = 0.45;
                for (let r = 0; r < rows; r++) {
                    for (let c = 0; c < cols; c++) {
                        let dbz = matrix[r][c] || 10;
                        if (dbz < 20) continue;
                        const geom = new THREE.PlaneGeometry(pSize, pSize);
                        geom.rotateX(-Math.PI / 2);
                        const mat = new THREE.MeshBasicMaterial({ 
                            color: getDbzColorHex(dbz), 
                            transparent: true, 
                            opacity: 0.85, 
                            side: THREE.DoubleSide 
                        });
                        const mesh = new THREE.Mesh(geom, mat);
                        mesh.position.set((c - cols/2) * pSize, 0, (r - rows/2) * pSize);
                        baseGroup.add(mesh);
                    }
                }
            }
            masterGroup.add(baseGroup);

            // 2. Struttura 3D Continua (Strati orizzontali fusi che mantengono la forma asimmetrica della matrice)
            const cell3DGroup = new THREE.Group();
            const numSlices = 14;
            const pSize = 0.45;

            if (matrix && Array.isArray(matrix)) {
                let maxDbz = 55;
                for (let r = 0; r < rows; r++) {
                    for (let c = 0; c < cols; c++) {
                        if (matrix[r][c] > maxDbz) maxDbz = matrix[r][c];
                    }
                }

                // Generiamo dischi/strati di forma sagomata basati direttamente sulla matrice
                for (let s = 0; s < numSlices; s++) {
                    let hRatio = s / numSlices; // da 0 (base) a 1 (cima)
                    let yPos = (hRatio * 7.5) - 2.5;

                    // In alto la nube si espande organicamente (incudine)
                    let scaleFactor = 1.0 + Math.pow(hRatio, 1.4) * 1.5;

                    const sliceGroup = new THREE.Group();
                    sliceGroup.position.y = yPos;

                    for (let r = 0; r < rows; r++) {
                        for (let c = 0; c < cols; c++) {
                            let dbz = matrix[r][c] || 10;
                            // Salendo in quota, i pixel a minor riflettività svaniscono, lasciando il core imponente
                            let threshold = 30 + (hRatio * 25);
                            if (dbz < threshold) continue;

                            let layerDbz = Math.max(15, dbz - (hRatio * 14));
                            let colHex = getDbzColorHex(layerDbz);

                            // Geometria morbida e fusa (cilindri/scatole arrotondate ravvicinate)
                            const geom = new THREE.CylinderGeometry(pSize * scaleFactor * 0.7, pSize * scaleFactor * 0.7, 0.55, 12);
                            let mat;
                            if (mode === 'solid') {
                                mat = new THREE.MeshStandardMaterial({
                                    color: colHex, roughness: 0.25, transparent: true, opacity: 0.75
                                });
                            } else if (mode === 'iso') {
                                mat = new THREE.MeshPhysicalMaterial({
                                    color: colHex, roughness: 0.15, transmission: 0.65, transparent: true, opacity: 0.6
                                });
                            } else {
                                mat = new THREE.MeshBasicMaterial({
                                    color: colHex, wireframe: true, transparent: true, opacity: 0.55
                                });
                            }

                            const mesh = new THREE.Mesh(geom, mat);
                            mesh.position.set((c - cols/2) * pSize * scaleFactor, 0, (r - rows/2) * pSize * scaleFactor);
                            sliceGroup.add(mesh);
                        }
                    }
                    cell3DGroup.add(sliceGroup);
                }
            }

            masterGroup.add(cell3DGroup);
            return masterGroup;
        }

        function animateCell3D() {
            requestAnimationFrame(animateCell3D);
            if (!isDragging && document.getElementById('view-3d').classList.contains('active')) {
                rotY += 0.003;
                if (cellRootGroup) cellRootGroup.rotation.y = rotY;
            }
            if (cellRenderer && cellScene && cellCamera) {
                cellRenderer.render(cellScene, cellCamera);
            }
        }
    </script>
</body>
</html>
