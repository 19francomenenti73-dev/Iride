<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I.R.I.D.E. - Real Engine 3D Tomography</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { background-color: #050811; color: #e2e8f0; font-family: monospace; overflow: hidden; height: 100vh; }
        
        #map-view, #canvas-container {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
        }
        #map-view { z-index: 1; display: block; }
        #canvas-container { z-index: 2; display: none; }

        .map-header {
            position: absolute; top: 0; left: 0; width: 100vw;
            background: rgba(10, 15, 30, 0.9); backdrop-filter: blur(8px);
            border-bottom: 1px solid rgba(59, 130, 246, 0.3);
            padding: 10px 15px; z-index: 1000;
            display: flex; justify-content: space-between; align-items: center;
        }
        .logo-title { font-size: 1rem; font-weight: bold; color: #38bdf8; letter-spacing: 1px; }
        .tracker-badge { background: rgba(74, 222, 128, 0.15); border: 1px solid #4ade80; color: #4ade80; padding: 3px 8px; border-radius: 4px; font-size: 0.7rem; font-weight: bold; }

        .top-banner {
            position: absolute; top: 0; left: 0; width: 100vw;
            background: rgba(10, 15, 30, 0.92); backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(59, 130, 246, 0.4);
            padding: 10px 16px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.7);
            z-index: 1000; display: flex; flex-direction: column; gap: 8px;
        }

        .banner-header { display: flex; justify-content: space-between; align-items: center; }
        
        .btn-back {
            background: #ef4444; color: #fff; border: 1px solid #f87171;
            padding: 6px 12px; border-radius: 4px; font-weight: bold; font-size: 0.75rem; cursor: pointer;
        }
        .btn-back:hover { background: #dc2626; }

        .metrics-bar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; font-size: 0.7rem; }
        .metric-box { background: rgba(255, 255, 255, 0.04); padding: 4px 6px; border-radius: 4px; border-left: 2px solid #38bdf8; }
        .metric-label { color: #94a3b8; font-size: 0.6rem; }
        .metric-val { color: #fff; font-weight: bold; font-size: 0.85rem; }

        .controls-row { display: grid; grid-template-columns: 1fr 1.2fr 0.8fr; gap: 10px; align-items: center; font-size: 0.7rem; }
        .ctrl-item { display: flex; flex-direction: column; gap: 2px; }
        .ctrl-item label { color: #94a3b8; font-size: 0.65rem; }

        .btn-group { display: flex; gap: 4px; }
        button.ctrl-btn {
            flex: 1; background: #1e293b; color: #38bdf8; border: 1px solid #38bdf8;
            padding: 4px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 0.7rem;
        }
        button.ctrl-btn:hover { background: #38bdf8; color: #0f172a; }

        input[type=range] { width: 100%; accent-color: #38bdf8; }

        .legend-inline { display: flex; justify-content: flex-end; gap: 8px; font-size: 0.6rem; align-items: center; }
        .legend-item { display: flex; align-items: center; gap: 3px; }
        .dot { width: 6px; height: 6px; border-radius: 50%; }

        .radar-pulse {
            width: 22px; height: 22px; background: rgba(239, 68, 68, 0.8);
            border: 2px solid #fff; border-radius: 50%; box-shadow: 0 0 15px #ef4444;
            animation: pulse 1.5s infinite; cursor: pointer;
        }
        @keyframes pulse {
            0% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { transform: scale(1.4); box-shadow: 0 0 0 12px rgba(239, 68, 68, 0); }
            100% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        @media (max-width: 600px) {
            .metrics-bar { grid-template-columns: repeat(2, 1fr); }
            .controls-row { grid-template-columns: 1fr; gap: 6px; }
        }
    </style>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <!-- VISTA 1: MAPPA 2D -->
    <div id="map-view">
        <div class="map-header">
            <div class="logo-title">I.R.I.D.E. <span style="font-size:0.7rem; color:#94a3b8;">Real Engine</span></div>
            <div class="tracker-badge" id="status-badge">• DB LOCALE ATTIVO</div>
        </div>
    </div>

    <!-- VISTA 2: VIEWER 3D TOMOGRAFICO PIENO -->
    <div id="canvas-container">
        <div class="top-banner">
            <div class="banner-header">
                <button class="btn-back" onclick="showMapView()">← INDIETRO MAPPA</button>
                <div style="font-size:0.85rem; font-weight:bold; color:#60a5fa;" id="cell-title">CELL ID: --</div>
            </div>

            <div class="metrics-bar">
                <div class="metric-box">
                    <div class="metric-label">dBZ MAX</div>
                    <div class="metric-val" style="color:#ff00aa" id="val-dbz">-- dBZ</div>
                </div>
                <div class="metric-box">
                    <div class="metric-label">ECHO TOP</div>
                    <div class="metric-val" id="val-top">-- km</div>
                </div>
                <div class="metric-box">
                    <div class="metric-label">PARALLELEPIPEDI</div>
                    <div class="metric-val" id="voxel-count">0</div>
                </div>
                <div class="metric-box">
                    <div class="metric-label">OPACITÀ BASE</div>
                    <div class="metric-val" id="opacity-val">70%</div>
                </div>
            </div>

            <div class="controls-row">
                <div class="ctrl-item">
                    <label>Opacità Volumetrica (±10%)</label>
                    <div class="btn-group">
                        <button class="ctrl-btn" onclick="adjustOpacity(-0.10)">- 10%</button>
                        <button class="ctrl-btn" onclick="adjustOpacity(0.10)">+ 10%</button>
                    </div>
                </div>

                <div class="ctrl-item">
                    <label>Sezione Tomografica RHI (Taglio XZ)</label>
                    <input type="range" id="slice-slider" min="-30" max="30" value="30" step="0.5">
                </div>

                <div class="ctrl-item">
                    <button class="ctrl-btn" onclick="refreshCellData()" style="height: 28px; margin-top: 10px;">Aggiorna Dati</button>
                </div>
            </div>

            <div class="legend-inline">
                <div class="legend-item"><div class="dot" style="background:#0055ff"></div> Blu</div>
                <div class="legend-item"><div class="dot" style="background:#00ff44"></div> Verde</div>
                <div class="legend-item"><div class="dot" style="background:#ffcc00"></div> Giallo</div>
                <div class="legend-item"><div class="dot" style="background:#ff2200"></div> Rosso</div>
                <div class="legend-item"><div class="dot" style="background:#ff00aa"></div> Mag.</div>
            </div>
        </div>
    </div>

    <script>
        let map;
        let activeCellsData = [];
        let selectedCell = null;

        let scene, camera, renderer, controls;
        let stormContainer;
        let materials = {};
        let currentOpacity = 0.70;
        const BOX_SIZE = 60;
        const BRICK = { x: 1.2, y: 0.8, z: 1.2 }; 

        // 1. INIZIALIZZAZIONE MAPPA E LETTURA DB LOCALE PYTHON
        async function initMap() {
            map = L.map('map-view', { zoomControl: false }).setView([41.9028, 12.4964], 6);
            
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 18,
                attribution: '© OpenStreetMap'
            }).addTo(map);

            try {
                // Legge direttamente il database generato dal motore Python
                const response = await fetch('data/iride_database.json');
                const db = await response.json();
                activeCellsData = db.cells || [];
                
                if (activeCellsData.length > 0) {
                    renderCentroids(activeCellsData);
                    document.getElementById('status-badge').innerText = `• ${activeCellsData.ِينَDE || activeCellsData.length} CELLE CARICATE`;
                } else {
                    document.getElementById('status-badge').innerText = '• NESSUNA CELLA >= 35 dBZ';
                }
            } catch (err) {
                console.warn("Impossibile leggere data/iride_database.json, verifica il percorso sul repository.");
                document.getElementById('status-badge').innerText = '• ERRORE LETTURA DB';
            }
        }

        function renderCentroids(cells) {
            const pulseIcon = L.divIcon({
                className: 'custom-pulse-icon',
                html: '<div class="radar-pulse"></div>',
                iconSize: [22, 22],
                iconAnchor: [11, 11]
            });

            cells.forEach(cell => {
                const marker = L.marker([cell.lat, cell.lon], { icon: pulseIcon }).addTo(map);
                marker.bindPopup(`
                    <div style="font-family:monospace; font-size:0.8rem; text-align:center;">
                        <b>${cell.id}</b><br>
                        <span style="color:#ef4444; font-weight:bold;">${cell.max_dbz} dBZ</span> | Top: ${cell.severity.echo_top}km<br>
                        Moto: ${cell.kinematics.velocity_kmh} km/h (${cell.kinematics.direction_deg}°)<br><br>
                        <button onclick="open3DViewer('${cell.id}')" style="background:#3b82f6; color:#fff; border:none; padding:6px 10px; border-radius:4px; cursor:pointer; font-weight:bold;">
                            APRI TOMOGRAFIA 3D
                        </button>
                    </div>
                `);
            });
        }

        function open3DViewer(cellId) {
            selectedCell = activeCellsData.find(c => c.id === cellId);
            if (!selectedCell) return;
            
            document.getElementById('cell-title').innerText = `CELL ID: ${selectedCell.id}`;
            document.getElementById('val-dbz').innerText = `${selectedCell.max_dbz} dBZ`;
            document.getElementById('val-top').innerText = `${selectedCell.severity.echo_top} km`;

            document.getElementById('map-view').style.display = 'none';
            document.getElementById('canvas-container').style.display = 'block';

            if (!renderer) {
                init3D();
            } else {
                onWindowResize();
                refreshCellData();
            }
        }

        function showMapView() {
            document.getElementById('canvas-container').style.display = 'none';
            document.getElementById('map-view').style.display = 'block';
            if (map) map.invalidateSize();
        }

        function init3D() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x050811, 0.009);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(65, 30, 75);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.target.set(0, -5, 0);

            scene.add(new THREE.AmbientLight(0xffffff, 0.75));
            let dirLight = new THREE.DirectionalLight(0xffffff, 0.85);
            dirLight.position.set(40, 60, 40);
            scene.add(dirLight);

            createBoundingBox();
            setupMaterials();
            refreshCellData();

            window.addEventListener('resize', onWindowResize);
            document.getElementById('slice-slider').addEventListener('input', (e) => {
                applyRHISlice(parseFloat(e.target.value));
            });

            animate();
        }

        function createBoundingBox() {
            const wireGeo = new THREE.BoxGeometry(BOX_SIZE, BOX_SIZE, BOX_SIZE);
            const wireMat = new THREE.MeshBasicMaterial({ color: 0x1e3a5f, wireframe: true, transparent: true, opacity: 0.12 });
            scene.add(new THREE.Mesh(wireGeo, wireMat));

            const grid = new THREE.GridHelper(BOX_SIZE, 12, 0x38bdf8, 0x1e293b);
            grid.position.y = -BOX_SIZE / 2;
            scene.add(grid);
        }

        function setupMaterials() {
            materials.blue = new THREE.MeshStandardMaterial({ color: 0x0055ff, transparent: true, opacity: currentOpacity * 0.45, depthWrite: false });
            materials.green = new THREE.MeshStandardMaterial({ color: 0x00ff44, transparent: true, opacity: currentOpacity * 0.65, depthWrite: false });
            materials.yellow = new THREE.MeshStandardMaterial({ color: 0xffcc00, transparent: true, opacity: currentOpacity * 0.80, depthWrite: false });
            materials.red = new THREE.MeshStandardMaterial({ color: 0xff2200, transparent: true, opacity: Math.min(1.0, currentOpacity * 0.95), depthWrite: false });
            materials.magenta = new THREE.MeshStandardMaterial({ color: 0xff00aa, transparent: true, opacity: Math.min(1.0, currentOpacity * 1.05), depthWrite: false });
        }

        // COSTRUZIONE TOMOGRAFIA 3D BASATA SULLA GRID_MATRIX REALE DEL BACKEND
        function buildSolidTomographyFromRealMatrix() {
            if (stormContainer) scene.remove(stormContainer);
            stormContainer = new THREE.Group();

            if (!selectedCell || !selectedCell.grid_matrix) return;

            const matrix = selectedCell.grid_matrix;
            const gridRows = matrix.length;
            const gridCols = matrix[0].length;
            const brickGeometry = new THREE.BoxGeometry(BRICK.x, BRICK.y, BRICK.z);
            let totalBricks = 0;
            const maxTargetBricks = 4000;

            const halfRows = gridRows / 2;
            const halfCols = gridCols / 2;
            const startY = BOX_SIZE / 2 - BRICK.y;

            for (let r = 0; r < gridRows; r++) {
                for (let c = 0; c < gridCols; c++) {
                    const dbz = matrix[r][c];
                    if (dbz < 25) continue;

                    const posX = (c - halfCols) * BRICK.x;
                    const posZ = (r - halfRows) * BRICK.z;
                    const distFromCenter = Math.hypot(c - halfCols, r - halfRows);

                    const cellMaxLayers = Math.max(8, Math.floor((dbz / 73) * 22));

                    for (let l = 0; l < cellMaxLayers; l++) {
                        if (totalBricks >= maxTargetBricks) break;

                        const normH = l / cellMaxLayers; 
                        const posY = startY - (l * (BRICK.y + 0.02));
                        const tiltX = posX + (normH * 1.5);

                        let matType = 'blue';

                        // GERARCHIA RIGOROSA DALL'ALTO VERSO IL BASSO:
                        if (normH < 0.25) {
                            matType = 'blue';    // Volta superiore ancorata in quota
                        } else if (normH < 0.50) {
                            matType = 'green';   // Gusci verdi a scendere
                        } else if (normH < 0.72) {
                            matType = 'yellow';  // Fascia gialla
                        } else {
                            // Core Rosso e Magenta ancorato chirurgicamente sul gradiente Giallo-Verde
                            if (distFromCenter < 3.0 && normH >= 0.65 && normH <= 0.85) {
                                matType = (dbz > 65) ? 'magenta' : 'red';
                            } else {
                                matType = 'yellow';
                            }
                        }

                        const brickMesh = new THREE.Mesh(brickGeometry, materials[matType]);
                        brickMesh.position.set(tiltX, posY, posZ);
                        brickMesh.userData = { origX: tiltX, origY: posY, origZ: posZ };

                        stormContainer.add(brickMesh);
                        totalBricks++;
                    }
                }
            }

            scene.add(stormContainer);
            document.getElementById('voxel-count').innerText = totalBricks;
        }

        function adjustOpacity(delta) {
            currentOpacity = Math.max(0.1, Math.min(1.0, currentOpacity + delta));
            document.getElementById('opacity-val').innerText = Math.round(currentOpacity * 100) + '%';

            materials.blue.opacity = currentOpacity * 0.45;
            materials.green.opacity = currentOpacity * 0.65;
            materials.yellow.opacity = currentOpacity * 0.80;
            materials.red.opacity = Math.min(1.0, currentOpacity * 0.95);
            materials.magenta.opacity = Math.min(1.0, currentOpacity * 1.05);
        }

        function applyRHISlice(limitX) {
            if (!stormContainer) return;
            stormContainer.children.forEach(child => {
                child.visible = (child.userData.origX <= limitX);
            });
        }

        function refreshCellData() {
            buildSolidTomographyFromRealMatrix();
            document.getElementById('slice-slider').value = 30;
            applyRHISlice(30);
        }

        function onWindowResize() {
            if (!renderer) return;
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            if (controls) controls.update();
            if (stormContainer) stormContainer.rotation.y += 0.0012;
            if (renderer && scene && camera) renderer.render(scene, camera);
        }

        window.onload = () => {
            initMap();
        };
    </script>
</body>
</html>
