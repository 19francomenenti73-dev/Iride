<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#07111d">
<title>I.R.I.D.E. | Nowcasting Italia</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{
 --bg:#07111d;
 --panel:#0b1928;
 --panel2:#102337;
 --line:#244158;
 --cyan:#00dff5;
 --yellow:#ffd000;
 --orange:#ff762d;
 --red:#ff4057;
 --text:#edf6ff;
 --muted:#91a9bd;
}
*{box-sizing:border-box}
html,body{
 margin:0;width:100%;height:100%;overflow:hidden;
 background:var(--bg);color:var(--text);
 font:14px system-ui,-apple-system,Segoe UI,sans-serif
}
button,select{
 background:var(--panel2);color:var(--text);
 border:1px solid var(--line);border-radius:7px;
 padding:9px 11px;font:inherit
}
button{cursor:pointer}
button:active{transform:scale(.98)}
header{
 height:58px;background:#071321;
 border-bottom:2px solid var(--cyan);
 display:flex;align-items:center;justify-content:space-between;
 padding:0 14px;gap:8px
}
.brand{
 font-size:18px;font-weight:900;letter-spacing:1.5px;
 color:#fff
}
.brand small{
 display:block;font-size:9px;letter-spacing:2px;
 color:var(--cyan);font-weight:700;margin-top:1px
}
#status{
 color:#a7bdcf;font-size:10px;text-align:right;
 line-height:1.4
}
.status-dot{
 display:inline-block;width:7px;height:7px;
 border-radius:50%;background:#20d889;margin-right:5px
}
#map{
 position:absolute;top:58px;bottom:0;width:100%;
 background:#0a1b2a
}
.top-panel{
 position:absolute;z-index:600;top:68px;left:10px;right:10px;
 display:flex;justify-content:space-between;align-items:center;
 gap:8px;pointer-events:none
}
.panel-tag{
 pointer-events:auto;background:#071321ed;
 border:1px solid var(--line);border-left:3px solid var(--cyan);
 border-radius:5px;padding:7px 10px;
 font-size:10px;font-weight:800;letter-spacing:1px
}
.panel-tag em{font-style:normal;color:var(--cyan)}
#reload{
 pointer-events:auto;border-color:#1688a5;color:var(--cyan);
 font-weight:800;padding:7px 12px
}
.legend{
 position:absolute;z-index:600;bottom:15px;left:10px;right:10px;
 display:flex;align-items:center;justify-content:center;
 flex-wrap:wrap;gap:10px;
 background:#071321ed;border:1px solid var(--line);
 border-radius:7px;padding:9px 8px
}
.legend span{
 display:flex;align-items:center;gap:5px;
 color:#d8e6f2;font-size:10px
}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.map-tools{
 position:absolute;z-index:600;right:10px;top:120px;
 display:flex;flex-direction:column;gap:6px
}
.map-tools button{font-size:11px;padding:7px 9px}
.leaflet-popup-content-wrapper{
 background:#0b1b2b;color:#edf6ff;
 border:1px solid #26708a;border-radius:9px
}
.leaflet-popup-tip{background:#0b1b2b}
.leaflet-popup-content{margin:12px;min-width:190px}
.popup-title{
 color:var(--cyan);font-weight:900;font-size:14px;
 margin-bottom:8px
}
.popup-line{font-size:12px;color:#d1e0ec;margin:5px 0}
.popup-note{
 font-size:10px;color:#91a9bd;margin-top:8px;line-height:1.4
}
.popup-action{
 width:100%;margin-top:10px;background:#073c53;
 border-color:var(--cyan);color:white;font-weight:800
}
#viewer{
 display:none;position:fixed;inset:0;z-index:2000;
 background:#050c15;flex-direction:column
}
#viewer.open{display:flex}
.vhead{
 min-height:58px;flex-shrink:0;background:#071321;
 border-bottom:2px solid var(--cyan);
 display:flex;align-items:center;justify-content:space-between;
 padding:7px 10px;gap:6px
}
#vtitle{font-size:12px;font-weight:900;color:var(--cyan)}
.vcontrols{display:flex;gap:5px;align-items:center}
.vcontrols select,.vcontrols button{font-size:11px;padding:8px 7px}
#mode{border-color:var(--cyan);max-width:145px}
#reset{color:var(--yellow)}
#close{color:#ff9a9a}
#scene{
 display:block;width:100%;height:100%;flex:1;min-height:0;
 touch-action:none
}
.vfoot{
 min-height:39px;display:flex;align-items:center;
 padding:0 12px;background:#071321;
 border-top:1px solid var(--line);
 color:var(--muted);font-size:10px
}
@media(min-width:700px){
 .top-panel{top:72px;left:18px;right:18px}
 .legend{left:18px;right:auto;bottom:18px}
}
@media(max-width:600px){
 header{height:52px;padding:0 10px}
 #map{top:52px}
 .brand{font-size:16px}
 #status{font-size:9px}
 .top-panel{top:61px}
 .panel-tag{font-size:9px;padding:6px 8px}
 .legend{gap:7px;padding:8px 5px}
 .legend span{font-size:9px}
 .map-tools{top:108px}
 .vhead{min-height:54px;padding:6px}
 #vtitle{font-size:10px;max-width:95px}
 .vcontrols{gap:3px}
 .vcontrols select,.vcontrols button{font-size:10px;padding:7px 5px}
 #mode{max-width:125px}
}
</style>
</head>
<body>

<header>
 <div class="brand">
  I.R.I.D.E.
  <small>INTEGRATED RADAR IMAGING & DETECTION ENGINE</small>
 </div>
 <div style="display:flex;align-items:center;gap:8px">
  <div id="status"><span class="status-dot"></span>OPERA · caricamento</div>
 </div>
</header>

<div id="map"></div>

<div class="top-panel">
 <div class="panel-tag">NOWCASTING ITALIA <em> / RADAR</em></div>
 <button id="reload">↻ AGGIORNA</button>
</div>

<div class="map-tools">
 <button id="vectorsToggle">VETTORI: ON</button>
 <button id="cellsToggle">CELLE: ON</button>
</div>

<div class="legend">
 <span><i class="dot" style="background:#397ee8"></i>15–24</span>
 <span><i class="dot" style="background:#24bd70"></i>25–29</span>
 <span><i class="dot" style="background:#f4d43e"></i>30–34</span>
 <span><i class="dot" style="background:#f07832"></i>35–44</span>
 <span><i class="dot" style="background:#ed42c8"></i>≥45 dBZ</span>
</div>

<div id="viewer">
 <div class="vhead">
  <b id="vtitle">RICOSTRUZIONE RADAR</b>
  <div class="vcontrols">
   <select id="mode">
    <option value="0">Voxel 3D</option>
    <option value="1">Iso-superficie</option>
    <option value="2">Holographic</option>
   </select>
   <button id="reset">RESET</button>
   <button id="close">CHIUDI</button>
  </div>
 </div>
 <canvas id="scene"></canvas>
 <div class="vfoot">
  ROTAZIONE 360° · INCLINAZIONE · ZOOM · BASE DBZH OSSERVATA · QUOTA MORFOLOGICA STIMATA
 </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(()=>{
'use strict';

const $=id=>document.getElementById(id);

const map=L.map('map',{
 preferCanvas:true,
 zoomControl:true
}).setView([43,12],5);

L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',{
 maxZoom:17,
 attribution:'© OpenTopoMap · © OpenStreetMap'
}).addTo(map);

const radarLayer=L.layerGroup().addTo(map);
const cellLayer=L.layerGroup().addTo(map);
const vectorLayer=L.layerGroup().addTo(map);

let radarImage=null;
let cells=[];
let showVectors=true;
let showCells=true;
let currentData=null;
let jsonLocation='docs/data/iride.json';

const color=v=>v>=45?'#ed42c8':
 v>=35?'#f07832':
 v>=30?'#f4d43e':
 v>=25?'#24bd70':
 v>=15?'#397ee8':'#000';

const finite=v=>Number.isFinite(Number(v));
const fmt=(v,d=1)=>finite(v)?Number(v).toFixed(d):'—';

const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({
 '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
})[c]);

function popupContent(c,index){
 const t=c.track||{};
 const speed=Number(t.speed_kmh);
 const validSpeed=Number.isFinite(speed);
 const area=Number(c.approx_area_km2);
 const morphology=c.morphology?.label||'Non classificata';

 return `
 <div class="popup-title">${safe(c.id)}</div>
 <div class="popup-line"><b>${fmt(c.max_dbz)} dBZ</b> · massimo</div>
 <div class="popup-line">Media: ${fmt(c.mean_dbz)} dBZ</div>
 <div class="popup-line">Area eco: ${Number.isFinite(area)?fmt(area)+' km²':'—'}</div>
 <div class="popup-line">Centroide: ${fmt(c.lat,3)}°, ${fmt(c.lon,3)}°</div>
 ${validSpeed?`<div class="popup-line">Velocità osservata: ${fmt(speed)} km/h</div>`:''}
 <div class="popup-line">Morfologia: ${safe(morphology)}</div>
 <div class="popup-note">Il contorno rappresenta il bordo dei pixel DBZH sopra soglia. La morfologia è preliminare.</div>
 ${c['3d_available']===true?`<button class="popup-action" id="open3d-${index}">APRI RICOSTRUZIONE 3D</button>`:''}
 `;
}

/* Vettori: limitiamo la visualizzazione alle celle più intense
   e a movimenti supportati da due osservazioni valide. */
function vectorIsUsable(c){
 const v=c.vectors||{};
 const t=c.track||{};
 const speed=Number(t.speed_kmh);
 const interval=Number(t.observed_interval_minutes);

 if(!Array.isArray(v.real)||v.real.length!==2)return false;
 if(!Array.isArray(v.predictive_180m)||v.predictive_180m.length!==2)return false;
 if(!Number.isFinite(speed)||speed<3||speed>100)return false;
 if(!Number.isFinite(interval)||interval<4||interval>60)return false;
 if(t.forecast_status!=='experimental_linear_extrapolation')return false;

 return true;
}

function drawVector(c){
 const v=c.vectors;
 const real=v.real;
 const forecast=v.predictive_180m;

 L.polyline(real,{
  color:'#00cfff',weight:3,opacity:.95,
  lineCap:'round'
 }).addTo(vectorLayer);

 L.polyline(forecast,{
  color:'#ff9b32',weight:2.5,opacity:.95,
  dashArray:'7 7',lineCap:'round'
 }).addTo(vectorLayer);
}

function addCell(c,index){
 const stroke=color(c.max_dbz);

 const points=Array.isArray(c.perimeter)?c.perimeter.filter(p=>
  Array.isArray(p)&&p.length>=2&&finite(p[0])&&finite(p[1])
 ):[];

 if(points.length>=3){
  L.polygon(points,{
   color:stroke,weight:1.4,opacity:.85,
   fillColor:stroke,fillOpacity:.08,
   smoothFactor:1
  }).addTo(cellLayer);
 }

 const marker=L.circleMarker([+c.lat,+c.lon],{
  radius:6,color:'#fff',weight:1.6,
  fillColor:stroke,fillOpacity:1
 }).addTo(cellLayer);

 marker.bindPopup(popupContent(c,index),{maxWidth:270});

 marker.on('popupopen',()=>{
  const button=$('open3d-'+index);
  if(button)button.onclick=()=>open3D(c);
 });

 if(showVectors&&vectorIsUsable(c))drawVector(c);
}

function overlayUrl(path){
 if(!path)return null;

 if(path.startsWith('http://')||path.startsWith('https://'))
  return path;

 if(path.startsWith('docs/'))return path;

 if(jsonLocation.startsWith('docs/'))return 'docs/'+path;

 return path;
}

function render(data){
 currentData=data;
 cells=Array.isArray(data.cells)?data.cells:[];

 radarLayer.clearLayers();
 cellLayer.clearLayers();
 vectorLayer.clearLayers();

 if(radarImage){
  map.removeLayer(radarImage);
  radarImage=null;
 }

 const overlay=data.radar_overlay;

 if(overlay?.image&&Array.isArray(overlay.bounds)){
  const url=overlayUrl(overlay.image);

  radarImage=L.imageOverlay(
   url+'?t='+Date.now(),
   overlay.bounds,
   {
    opacity:Math.min(1,Number(overlay.opacity)||.82),
    interactive:false,
    crossOrigin:false
   }
  ).addTo(radarLayer);

  radarImage.once('load',()=>{
   console.info('Overlay radar caricato:',url);
  });

  radarImage.once('error',()=>{
   console.error('Errore caricamento overlay:',url);
   $('status').textContent='OPERA · errore raster radar';
  });
 }

 const ordered=cells
  .map((c,i)=>({c,i}))
  .filter(x=>finite(x.c.lat)&&finite(x.c.lon))
  .sort((a,b)=>(Number(b.c.max_dbz)||0)-(Number(a.c.max_dbz)||0));

 ordered.forEach(({c,i})=>{
  if(showCells)addCell(c,i);
  else if(showVectors&&vectorIsUsable(c))drawVector(c);
 });

 $('status').innerHTML=
  '<span class="status-dot"></span>OPERA · '+
  safe(data.timestamp||'orario n/d')+' · '+cells.length+' celle';

 if(!map._irideCentered&&ordered.length){
  const bounds=ordered.map(x=>[+x.c.lat,+x.c.lon]);
  map.fitBounds(bounds,{padding:[25,25],maxZoom:7});
  map._irideCentered=true;
 }
}

async function fetchJson(path){
 const response=await fetch(path+'?t='+Date.now(),{
  cache:'no-store'
 });

 if(!response.ok)throw Error('HTTP '+response.status);

 const data=await response.json();

 if(data.status!=='ok'||!Array.isArray(data.cells))
  throw Error('Struttura JSON non valida');

 return data;
}

async function load(){
 $('status').textContent='OPERA · aggiornamento';

 try{
  let data;

  try{
   jsonLocation='docs/data/iride.json';
   data=await fetchJson(jsonLocation);
  }catch(firstError){
   jsonLocation='data/iride.json';
   data=await fetchJson(jsonLocation);
  }

  render(data);

 }catch(error){
  $('status').textContent='OPERA · dati non disponibili';
  console.error(error);
 }
}

$('reload').onclick=load;

$('vectorsToggle').onclick=()=>{
 showVectors=!showVectors;
 $('vectorsToggle').textContent='VETTORI: '+(showVectors?'ON':'OFF');
 if(currentData)render(currentData);
};

$('cellsToggle').onclick=()=>{
 showCells=!showCells;
 $('cellsToggle').textContent='CELLE: '+(showCells?'ON':'OFF');
 if(currentData)render(currentData);
};/* =====================================================
   RENDERER WEBGL 2 — TRE MODALITÀ DISTINTE
   La quota è morfologica e stimata, non misurata.
   ===================================================== */

const viewer=$('viewer');
const canvas=$('scene');

const gl=canvas.getContext('webgl2',{
 antialias:true,
 alpha:false,
 powerPreference:'high-performance'
});

if(!gl){
 $('status').textContent='WebGL2 non disponibile';
 return;
}

const vertexShader=`#version 300 es
in vec2 position;
out vec2 uv;
void main(){
 uv=position*.5+.5;
 gl_Position=vec4(position,0.,1.);
}`;

const fragmentShader=`#version 300 es
precision highp float;

in vec2 uv;
out vec4 outputColor;

uniform vec2 resolution;
uniform vec3 cameraPosition;
uniform vec3 cameraRight;
uniform vec3 cameraUp;
uniform vec3 cameraForward;
uniform float fov;
uniform sampler2D radarTexture;
uniform int renderMode;

const vec3 BG=vec3(.008,.018,.031);

vec4 radar(vec2 p){
 return texture(radarTexture,clamp(p,vec2(0.),vec2(1.)));
}

float echoClass(vec3 c){
 if(c.b>c.r*1.22 && c.b>c.g*1.12)return 1.;
 if(c.g>c.r*1.12 && c.g>c.b*1.05)return 2.;
 if(c.r>.65 && c.g>.55 && c.b<.35)return 3.;
 if(c.r>.65 && c.g<.48 && c.b<.35)return 4.;
 if(c.r>.60 && c.b>.35 && c.g<.40)return 5.;
 return 0.;
}

float echoTop(float k){
 if(k==1.)return 3.0;
 if(k==2.)return 2.65;
 if(k==3.)return 2.15;
 if(k==4.)return 1.7;
 if(k==5.)return 1.25;
 return 0.;
}

/* Espansione verticale differenziata.
   Blu e verde più larghi e trasparenti in quota.
   Giallo, arancio e magenta più compatti. */
float footprintScale(float k,float h,float top){
 float f=h/max(top,.01);

 if(k==1.)return 1.0+.14*f;
 if(k==2.)return 1.0+.11*f;
 if(k==3.)return 1.0-.10*f;
 if(k==4.)return 1.0-.20*f;
 if(k==5.)return 1.0-.30*f;

 return 1.;
}

float densityAt(vec3 p,out vec3 cellColor,out float klass){
 float h=p.y;

 if(h<.04||h>3.15)return 0.;

 vec2 local=vec2(
  (p.x+2.25)/4.5,
  (p.z+1.40)/2.8
 );

 vec2 center=vec2(.5);
 vec4 base=radar(local);

 klass=echoClass(base.rgb);
 cellColor=base.rgb;

 if(base.a<.1||klass<1.)return 0.;

 float top=echoTop(klass);
 if(top<=0.||h>top)return 0.;

 float scale=footprintScale(klass,h,top);
 vec2 expanded=center+(local-center)/scale;
 vec4 sampleColor=radar(expanded);

 float sampleClass=echoClass(sampleColor.rgb);
 if(sampleColor.a<.1||sampleClass<.5)return 0.;

 cellColor=sampleColor.rgb;

 float vertical=h/top;
 float lower=smoothstep(.025,.24,h);
 float upper=1.-smoothstep(.82,1.0,vertical);

 float density=lower*upper;

 if(klass==1.)density*=.17;
 if(klass==2.)density*=.23;
 if(klass==3.)density*=.55;
 if(klass==4.)density*=.68;
 if(klass==5.)density*=.78;

 /* Voxel: gradini verticali e blocchi definiti. */
 if(renderMode==0){
  float steps=12.;
  float stepped=floor(vertical*steps)/steps;
  density*=smoothstep(0.,.12,stepped);
  density*=.90;
 }

 /* Isosuperficie: parete compatta con bordo luminoso. */
 if(renderMode==1){
  float shell=smoothstep(.16,.36,density);
  float edge=1.-smoothstep(.025,.13,abs(density-.36));
  density=shell*.92+edge*.16;
 }

 /* Olografico: strati sottili, linee di scansione. */
 if(renderMode==2){
  float scan=.62+.38*sin(h*48.);
  float shell=1.-smoothstep(.025,.10,abs(fract(vertical*8.)-.5));
  density*=scan;
  density+=shell*.12;
 }

 return density;
}

bool intersectBox(
 vec3 ro,vec3 rd,out float nearT,out float farT
){
 vec3 low=vec3(-2.25,.04,-1.40);
 vec3 high=vec3(2.25,3.15,1.40);

 vec3 inv=1./rd;
 vec3 a=(low-ro)*inv;
 vec3 b=(high-ro)*inv;

 vec3 mn=min(a,b);
 vec3 mx=max(a,b);

 nearT=max(max(mn.x,mn.y),mn.z);
 farT=min(min(mx.x,mx.y),mx.z);

 return farT>max(nearT,0.);
}

void main(){
 vec2 screen=uv*2.-1.;
 screen.x*=resolution.x/resolution.y;

 vec3 direction=normalize(
  cameraForward+
  cameraRight*screen.x*fov+
  cameraUp*screen.y*fov
 );

 float nearT,farT;
 vec3 result=BG;

 /* Piano radar: texture DBZH osservata. */
 float floorT=-1.;

 if(direction.y<-.0001){
  floorT=(.04-cameraPosition.y)/direction.y;
 }

 if(floorT>0.){
  vec3 fp=cameraPosition+direction*floorT;

  if(abs(fp.x)<=2.25&&abs(fp.z)<=1.40){
   vec2 floorUV=vec2(
    (fp.x+2.25)/4.5,
    (fp.z+1.40)/2.8
   );

   vec4 base=radar(floorUV);
   result=mix(BG,base.rgb,base.a);
  }
 }

 /* Ray marching volume. */
 if(intersectBox(cameraPosition,direction,nearT,farT)){
  float startT=max(nearT,0.);
  float endT=farT;

  if(floorT>startT)endT=min(endT,floorT);

  float stepSize=(endT-startT)/190.;
  float transparency=1.;
  vec3 volume=vec3(0.);

  for(int i=0;i<190;i++){
   float t=startT+(float(i)+.5)*stepSize;
   vec3 p=cameraPosition+direction*t;
   vec3 cellColor;
   float klass;
   float density=densityAt(p,cellColor,klass);

   if(density>.012){
    float alpha=1.-exp(-density*stepSize*2.8);

    if(renderMode==1)alpha=min(.9,alpha*1.4);
    if(renderMode==2)alpha=min(.55,alpha*.9);

    volume+=transparency*alpha*cellColor;
    transparency*=1.-alpha;
   }

   if(transparency<.018)break;
  }

  result=volume+transparency*result;
 }

 /* Reticolo tecnico molto discreto in modalità olografica. */
 if(renderMode==2){
  float gridX=abs(fract((uv.x*resolution.x)/48.)-.5);
  float gridY=abs(fract((uv.y*resolution.y)/48.)-.5);
  float gridLine=1.-smoothstep(.47,.50,min(gridX,gridY));
  result+=vec3(.0,.12,.17)*gridLine*.12;
 }

 outputColor=vec4(result,1.);
}`;

function compileShader(type,source){
 const shader=gl.createShader(type);
 gl.shaderSource(shader,source);
 gl.compileShader(shader);

 if(!gl.getShaderParameter(shader,gl.COMPILE_STATUS)){
  const message=gl.getShaderInfoLog(shader);
  gl.deleteShader(shader);
  throw Error(message);
 }

 return shader;
}

const program=gl.createProgram();

gl.attachShader(
 program,compileShader(gl.VERTEX_SHADER,vertexShader)
);
gl.attachShader(
 program,compileShader(gl.FRAGMENT_SHADER,fragmentShader)
);
gl.linkProgram(program);

if(!gl.getProgramParameter(program,gl.LINK_STATUS))
 throw Error(gl.getProgramInfoLog(program));

gl.useProgram(program);

const buffer=gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER,buffer);

gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([
 -1,-1,1,-1,-1,1,1,1
]),gl.STATIC_DRAW);

const position=gl.getAttribLocation(program,'position');

gl.enableVertexAttribArray(position);
gl.vertexAttribPointer(position,2,gl.FLOAT,false,0,0);

const uniforms={};

[
 'resolution','cameraPosition','cameraRight','cameraUp',
 'cameraForward','fov','radarTexture','renderMode'
].forEach(name=>{
 uniforms[name]=gl.getUniformLocation(program,name);
});

const texture=gl.createTexture();

gl.activeTexture(gl.TEXTURE0);
gl.bindTexture(gl.TEXTURE_2D,texture);

gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.NEAREST);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.NEAREST);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);

gl.uniform1i(uniforms.radarTexture,0);

function radarColor(dbz){
 if(dbz>=45)return [237,66,200,255];
 if(dbz>=35)return [240,120,50,255];
 if(dbz>=30)return [244,212,62,255];
 if(dbz>=25)return [36,189,112,255];
 if(dbz>=15)return [57,126,232,255];
 return [0,0,0,0];
}

function uploadRadarMatrix(cell){
 const matrix=cell.grid_matrix;

 if(!Array.isArray(matrix)||matrix.length!==72)
  throw Error('Matrice DBZH 72×72 non disponibile');

 const width=72;
 const height=72;
 const pixels=new Uint8Array(width*height*4);

 for(let y=0;y<height;y++){
  const row=matrix[y]||[];

  for(let x=0;x<width;x++){
   const value=Number(row[x]);
   const rgba=radarColor(Number.isFinite(value)?value:0);
   const offset=((height-1-y)*width+x)*4;

   pixels[offset]=rgba[0];
   pixels[offset+1]=rgba[1];
   pixels[offset+2]=rgba[2];
   pixels[offset+3]=rgba[3];
  }
 }

 gl.activeTexture(gl.TEXTURE0);
 gl.bindTexture(gl.TEXTURE_2D,texture);
 gl.pixelStorei(gl.UNPACK_ALIGNMENT,1);

 gl.texImage2D(
  gl.TEXTURE_2D,0,gl.RGBA,
  width,height,0,gl.RGBA,gl.UNSIGNED_BYTE,pixels
 );
 }/* =====================================================
   CAMERA, ROTAZIONE E INTERAZIONE
   ===================================================== */

let yaw=-.35;
let pitch=.34;
let distance=7.1;
let activeCell=null;
let dragging=false;
let lastX=0;
let lastY=0;
let pinchDistance=0;

function normalize(v){
 const length=Math.hypot(v[0],v[1],v[2])||1;
 return v.map(n=>n/length);
}

function cross(a,b){
 return [
  a[1]*b[2]-a[2]*b[1],
  a[2]*b[0]-a[0]*b[2],
  a[0]*b[1]-a[1]*b[0]
 ];
}

function resizeCanvas(){
 const rect=canvas.getBoundingClientRect();
 const ratio=Math.min(window.devicePixelRatio||1,2);

 canvas.width=Math.max(1,Math.round(rect.width*ratio));
 canvas.height=Math.max(1,Math.round(rect.height*ratio));

 gl.viewport(0,0,canvas.width,canvas.height);
}

function drawScene(){
 if(!activeCell||!viewer.classList.contains('open'))return;

 const width=canvas.width;
 const height=canvas.height;

 if(!width||!height)return;

 const target=[0,.9,0];
 const cp=Math.cos(pitch);
 const sp=Math.sin(pitch);
 const sy=Math.sin(yaw);
 const cy=Math.cos(yaw);

 const camera=[
  distance*cp*sy,
  target[1]+distance*sp,
  distance*cp*cy
 ];

 const forward=normalize([
  target[0]-camera[0],
  target[1]-camera[1],
  target[2]-camera[2]
 ]);

 const right=normalize(cross(forward,[0,1,0]));
 const up=normalize(cross(right,forward));

 gl.useProgram(program);

 gl.uniform2f(uniforms.resolution,width,height);
 gl.uniform3fv(uniforms.cameraPosition,camera);
 gl.uniform3fv(uniforms.cameraRight,right);
 gl.uniform3fv(uniforms.cameraUp,up);
 gl.uniform3fv(uniforms.cameraForward,forward);

 gl.uniform1f(
  uniforms.fov,
  Math.tan(32*Math.PI/180)
 );

 gl.uniform1i(
  uniforms.renderMode,
  Number($('mode').value)||0
 );

 gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
}

function open3D(cell){
 if(cell['3d_available']!==true){
  alert('Questa cella non è inclusa nelle 30 selezionate per il 3D.');
  return;
 }

 try{
  activeCell=cell;
  uploadRadarMatrix(cell);

  $('vtitle').textContent=
   cell.id+' · '+fmt(cell.max_dbz)+' dBZ';

  yaw=-.35;
  pitch=.34;
  distance=7.1;

  viewer.classList.add('open');

  requestAnimationFrame(()=>{
   resizeCanvas();
   drawScene();
  });

 }catch(error){
  console.error(error);
  alert('Ricostruzione 3D: '+error.message);
 }
}

$('mode').onchange=drawScene;

$('close').onclick=()=>{
 viewer.classList.remove('open');
 activeCell=null;
};

$('reset').onclick=()=>{
 yaw=-.35;
 pitch=.34;
 distance=7.1;
 drawScene();
};

window.addEventListener('resize',()=>{
 if(viewer.classList.contains('open')){
  resizeCanvas();
  drawScene();
 }
});

canvas.addEventListener('pointerdown',event=>{
 dragging=true;
 lastX=event.clientX;
 lastY=event.clientY;
 canvas.setPointerCapture(event.pointerId);
});

canvas.addEventListener('pointermove',event=>{
 if(!dragging)return;

 const dx=event.clientX-lastX;
 const dy=event.clientY-lastY;

 yaw-=dx*.006;
 pitch=Math.max(-.12,Math.min(1.12,pitch+dy*.004));

 lastX=event.clientX;
 lastY=event.clientY;

 drawScene();
});

canvas.addEventListener('pointerup',()=>dragging=false);
canvas.addEventListener('pointercancel',()=>dragging=false);

canvas.addEventListener('wheel',event=>{
 event.preventDefault();

 distance=Math.max(
  4.0,
  Math.min(13,distance+event.deltaY*.008)
 );

 drawScene();
},{passive:false});

/* Zoom pinch a due dita. */
canvas.addEventListener('touchstart',event=>{
 if(event.touches.length===2){
  pinchDistance=Math.hypot(
   event.touches[0].clientX-event.touches[1].clientX,
   event.touches[0].clientY-event.touches[1].clientY
  );
 }
},{passive:true});

canvas.addEventListener('touchmove',event=>{
 if(event.touches.length!==2)return;

 event.preventDefault();

 const next=Math.hypot(
  event.touches[0].clientX-event.touches[1].clientX,
  event.touches[0].clientY-event.touches[1].clientY
 );

 if(pinchDistance>0&&next>0){
  distance=Math.max(
   4.0,
   Math.min(13,distance*pinchDistance/next)
  );
  drawScene();
 }

 pinchDistance=next;
},{passive:false});

canvas.addEventListener('touchend',()=>{
 pinchDistance=0;
},{passive:true});

/* Aggiornamento automatico ogni 15 minuti.
   Nessun aggiornamento del backend da questa pagina. */
load();
setInterval(load,15*60*1000);

})();
</script>
