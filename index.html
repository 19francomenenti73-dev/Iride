<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>I.R.I.D.E. - Advanced Volumetric Engine</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --bg-deep: #020408;
            --panel-bg: rgba(4, 10, 20, 0.95);
            --border-color: #102238;
            --cyan-glow: #00d2ff;
            --pink-core: #ff0055;
            --text-main: #ffffff;
        }
        * { box-sizing: border-box; touch-action: none; }
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg-deep); color: var(--text-main); font-family: system-ui, sans-serif; overflow: hidden; }

        #view-tracker { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; z-index: 1; }
        #header-tracker { height: 52px; min-height: 52px; background: var(--panel-bg); border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; padding: 0 16px; }
        #map { width: 100%; flex-grow: 1; background: var(--bg-deep); }

        #view-3d { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at center, #071325 0%, #020408 100%); display: none; flex-direction: column; z-index: 2000; }
        #view-3d.active { display: flex; }

        #header-3d { background: var(--panel-bg); border-bottom: 1px solid var(--border-color); padding: 12px 16px; }
        .tele-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .btn-close { background: var(--pink-core); color: #fff; border: none; padding: 6px 14px; border-radius: 4px; font-weight: bold; font-size: 11px; cursor: pointer; }
        .tele-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 12px; font-size: 11px; color: #94a3b8; border-top: 1px solid var(--border-color); padding-top: 6px; }
        .tele-grid span { color: #fff; font-weight: bold; }

        #canvas-container-3d { flex-grow: 1; position: relative; width: 100%; height: 100%; overflow: hidden; }
        #canvas-cell-3d { width: 100% !important; height: 100% !important; display: block; }
        .hud-hint { position: absolute; bottom: 14px; width: 100%; text-align: center; font-size: 10px; color: #64748b; pointer-events: none; letter-spacing: 1px; }
    </style>
</head>
<body>
    <div id="view-tracker">
        <div id="header-tracker">
            <div style="font-weight: 800; font-size: 16px; color: var(--cyan-glow); letter-spacing: 1.5px;">I.R.I.D.E.</div>
            <div style="font-size: 11px; color: #00ff66; font-weight: bold; background: rgba(0,255,102,0.1); padding: 4px 8px; border-radius: 4px; border: 1px solid rgba(0,255,102,0.3);">● TRACKER ATTIVO</div>
        </div>
        <div id="map"></div>
    </div>

    <div id="view-3d">
        <div id="header-3d">
            <div class="tele-top">
                <div>
                    <div id="h-core-id" style="font-size: 14px; font-weight: bold; color: var(--cyan-glow);">Core-Cell</div>
                    <div style="font-size: 11px; color: var(--pink-core);" id="t-dbz">Riflettività: --</div>
                </div>
                <button class="btn-close" onclick="close3DView()">CHIUDI ✕</button>
            </div>
            <div class="tele-grid">
                <div>VIL: <span id="t-vil">--</span></div>
                <div>Echo top: <span id="t-top">--</span></div>
                <div>Velocità: <span id="t-vel">--</span></div>
                <div>Direzione: <span id="t-dir">--</span></div>
            </div>
        </div>
        <div id="canvas-container-3d">
            <canvas id="canvas-cell-3d"></canvas>
            <div class="hud-hint">TRASCINA PER RUOTARE IL MODELLO 3D · ANCORATO A GRID_MATRIX</div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const map = L.map('map', { zoomControl: false, attributionControl: false }).setView([41.9, 12.5], 6);
        L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', { maxZoom: 17 }).addTo(map);
        setTimeout(() => map.invalidateSize(), 200);

        let activeCellData = null;
        let renderer = null, scene = null, camera = null, cellGroup = null;
        let isDragging = false, prevMouse = { x: 0, y: 0 };
        let rotY = 0.6, tiltX = 0.45;

        const pathSegments = window.location.pathname.split('/').filter(Boolean);
        const jsonUrl = window.location.hostname.includes('github.io') && pathSegments.length > 0 
            ? `/${pathSegments[0]}/data/iride_database.json` 
            : 'data/iride_database.json';

        fetch(jsonUrl)
            .then(res => res.ok ? res.json() : Promise.reject())
            .then(data => {
                if (data?.radar_tile_path) {
                    L.tileLayer(`https://tilecache.rainviewer.com${data.radar_tile_path}/256/{z}/{x}/{y}/2/1_1.png`, { opacity: 0.75 }).addTo(map);
                }
                if (data?.cells) renderCentroids(data.cells);
                else loadMockData();
            })
            .catch(() => loadMockData());

        function loadMockData() {
            const matrix = Array(16).fill(0).map(() => Array(16).fill(10));
            for(let r=3; r<13; r++) {
                for(let c=3; c<13; c++) {
                    let d = Math.hypot(r-8, c-8);
                    matrix[r][c] = Math.max(15, 72 - (d * 5.5));
                }
            }
            renderCentroids([{
                id: "Core-51712-PRO", lat: 41.89, lon: 12.49, max_dbz: 62.8,
                severity: { vil: 74.2, echo_top: 13.4 },
                kinematics: { velocity_kmh: 52, direction_deg: 315 },
                grid_matrix: matrix
            }]);
        }

        function renderCentroids(cells) {
            cells.forEach(cell => {
                const icon = L.divIcon({
                    className: '',
                    html: `<div style="width:28px; height:28px; border:2px solid #ff0055; border-radius:50%; background:rgba(255,0,85,0.35); display:flex; align-items:center; justify-content:center;"><div style="width:9px; height:9px; background:#ff0055; border-radius:50%;"></div></div>`,
                    iconSize: [28, 28]
                });
                L.marker([cell.lat, cell.lon], { icon }).addTo(map).on('click', () => open3DView(cell));
            });
        }

        function open3DView(cell) {
            activeCellData = cell;
            document.getElementById('h-core-id').innerText = cell.id;
            document.getElementById('t-dbz').innerText = `Riflettività Max: ${cell.max_dbz} dBZ`;
            document.getElementById('t-vil').innerText = `${cell.severity.vil} kg/m²`;
            document.getElementById('t-top').innerText = `${cell.severity.echo_top} km`;
            document.getElementById('t-vel').innerText = `${cell.kinematics.velocity_kmh} km/h`;
            document.getElementById('t-dir').innerText = `${cell.kinematics.direction_deg}°`;

            document.getElementById('view-3d').classList.add('active');
            setTimeout(initEngine3D, 50);
        }

        function close3DView() {
            document.getElementById('view-3d').classList.remove('active');
        }

        function getRadarColor(dbz) {
            if (dbz >= 65) return new THREE.Color(0xff00ff);
            if (dbz >= 55) return new THREE.Color(0xff0044);
            if (dbz >= 48) return new THREE.Color(0xff5500);
            if (dbz >= 40) return new THREE.Color(0xffcc00);
            if (dbz >= 30) return new THREE.Color(0x00e64d);
            if (dbz >= 20) return new THREE.Color(0x00b4d8);
            return new THREE.Color(0x0055ff);
        }

        function initEngine3D() {
            const container = document.getElementById('canvas-container-3d');
            const canvas = document.getElementById('canvas-cell-3d');
            const width = container.clientWidth || window.innerWidth;
            const height = container.clientHeight || (window.innerHeight - 150);

            if (!renderer) {
                renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, powerPreference: "high-performance" });
                renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                scene = new THREE.Scene();
                camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
                camera.position.set(0, 18, 32);
                camera.lookAt(0, 0, 0);

                scene.add(new THREE.AmbientLight(0xffffff, 1.5));
                const dirLight = new THREE.DirectionalLight(0xffffff, 2.0);
                dirLight.position.set(20, 40, 20);
                scene.add(dirLight);

                const blueLight = new THREE.DirectionalLight(0x00d2ff, 1.0);
                blueLight.position.set(-20, -10, -20);
                scene.add(blueLight);

                container.addEventListener('pointerdown', e => { isDragging = true; prevMouse = { x: e.clientX, y: e.clientY }; });
                window.addEventListener('pointermove', e => {
                    if (!isDragging || !document.getElementById('view-3d').classList.contains('active')) return;
                    rotY += (e.clientX - prevMouse.x) * 0.007;
                    tiltX = Math.max(0.1, Math.min(0.7, tiltX + (e.clientY - prevMouse.y) * 0.007));
                    if (cellGroup) { cellGroup.rotation.y = rotY; cellGroup.rotation.x = tiltX; }
                    prevMouse = { x: e.clientX, y: e.clientY };
                });
                window.addEventListener('pointerup', () => isDragging = false);
                window.addEventListener('resize', () => {
                    if (!renderer) return;
                    const w = container.clientWidth || window.innerWidth;
                    const h = container.clientHeight || (window.innerHeight - 150);
                    renderer.setSize(w, h);
                    camera.aspect = w / h;
                    camera.updateProjectionMatrix();
                });
                animateLoop();
            }

            renderer.setSize(width, height);
            camera.aspect = width / height;
            camera.updateProjectionMatrix();

            if (cellGroup) scene.remove(cellGroup);
            cellGroup = buildProfessionalSupercell(activeCellData?.grid_matrix);
            scene.add(cellGroup);
        }

        function buildProfessionalSupercell(matrix) {
            const masterGroup = new THREE.Group();
            masterGroup.rotation.x = tiltX;
            masterGroup.rotation.y = rotY;

            const rows = matrix?.length || 16;
            const cols = matrix[0]?.length || 16;
            const step = 0.85;
            const offsetX = (cols * step) / 2;
            const offsetZ = (rows * step) / 2;

            const groundGroup = new THREE.Group();
            groundGroup.position.y = -3.0;
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const geom = new THREE.BoxGeometry(step * 0.95, 0.1, step * 0.95);
                    const mat = new THREE.MeshBasicMaterial({ color: 0x00d2ff, wireframe: true, transparent: true, opacity: 0.25 });
                    const box = new THREE.Mesh(geom, mat);
                    box.position.set(c * step - offsetX, 0, r * step - offsetZ);
                    groundGroup.add(box);
                }
            }
            masterGroup.add(groundGroup);

            const volumeGroup = new THREE.Group();
            const maxLevels = 15;

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    let baseDbz = matrix[r][c] || 10;
                    if (baseDbz < 16) continue;

                    let levelsCount = Math.min(maxLevels, Math.max(2, Math.floor((baseDbz / 70.0) * maxLevels)));

                    for (let h = 0; h < levelsCount; h++) {
                        let currentDbz = baseDbz + (h * 1.4);
                        let heightRatio = h / maxLevels;

                        let radiusMultiplier = heightRatio > 0.3 ? 1.0 + Math.pow(heightRatio - 0.3, 1.5) * 2.8 : 0.9 + (heightRatio * 0.3);
                        let geom = new THREE.CylinderGeometry(step * 0.42 * radiusMultiplier, step * 0.46 * radiusMultiplier, 0.35, 16);
                        
                        let mat = new THREE.MeshPhysicalMaterial({
                            color: getRadarColor(currentDbz),
                            transparent: true,
                            opacity: 0.78,
                            roughness: 0.12,
                            metalness: 0.05,
                            transmission: 0.35,
                            thickness: 1.0,
                            depthWrite: false
                        });

                        let mesh = new THREE.Mesh(geom, mat);
                        mesh.position.set(c * step - offsetX, (h * 0.38) - 2.6, r * step - offsetZ);
                        volumeGroup.add(mesh);
                    }
                }
            }

            masterGroup.add(volumeGroup);
            return masterGroup;
        }

        function animateLoop() {
            requestAnimationFrame(animateLoop);
            if (!isDragging && document.getElementById('view-3d').classList.contains('active')) {
                rotY += 0.0003;
                if (cellGroup) cellGroup.rotation.y = rotY;
            }
            if (renderer && scene && camera) {
                renderer.render(scene, camera);
            }
        }
    </script>
</body>
</html>
