<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>I.R.I.D.E.</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07111d;color:#eaf3fc;font:14px system-ui}
header{height:52px;background:#081321;display:flex;align-items:center;justify-content:space-between;padding:0 12px;border-bottom:1px solid #26384b}
.brand{font-weight:800;letter-spacing:1px;font-size:17px}
#status{font-size:11px;color:#9db4c9}
button,select{background:#172b40;color:#f2f7fc;border:1px solid #38516b;border-radius:8px;padding:8px 11px;font:inherit}
button{cursor:pointer}
#map{height:calc(100% - 52px);width:100%;background:#0a1724}
.legend{position:absolute;z-index:500;bottom:18px;left:12px;background:#071522eF;border:1px solid #34495d;border-radius:9px;padding:8px 10px;display:flex;gap:9px;flex-wrap:wrap;max-width:calc(100% - 24px)}
.legend span{font-size:10px;display:flex;align-items:center;gap:4px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.leaflet-popup-content-wrapper{background:#101f30;color:#eef5fc;border:1px solid #38516b;border-radius:10px}
.leaflet-popup-tip{background:#101f30}
.leaflet-popup-content{margin:12px;min-width:190px}
.popup-title{font-weight:800;font-size:14px;margin-bottom:7px}
.popup-line{font-size:12px;color:#c5d4e2;margin:4px 0}
.popup-note{font-size:10px;color:#91a9bd;margin-top:8px;line-height:1.4}
.popup-action{width:100%;margin-top:9px;background:#17415a;border-color:#3281a8}
#viewer{display:none;position:fixed;inset:0;z-index:2000;background:#03070d;flex-direction:column}
#viewer.open{display:flex}
.vhead{height:54px;flex-shrink:0;background:#050b13;display:flex;align-items:center;justify-content:space-between;padding:7px 10px;gap:7px}
#vtitle{font-size:13px;font-weight:700}
#scene{display:block;width:100%;height:calc(100% - 96px);flex:1;min-height:0;touch-action:none}
.vfoot{height:42px;display:flex;align-items:center;padding:0 12px;background:#050b13;color:#8fa5b9;font-size:10px}
@media(max-width:600px){
 header{height:48px}
 #map{height:calc(100% - 48px)}
 .vhead{height:52px}
 .vhead button,.vhead select{padding:7px 8px;font-size:12px}
}
</style>
</head>
<body>

<header>
 <div class="brand">I.R.I.D.E.</div>
 <div style="display:flex;align-items:center;gap:9px">
  <span id="status">OPERA · caricamento</span>
  <button id="reload">↻</button>
 </div>
</header>

<div id="map"></div>

<div class="legend">
 <span><i class="dot" style="background:#397ee8"></i>15–24</span>
 <span><i class="dot" style="background:#24bd70"></i>25–29</span>
 <span><i class="dot" style="background:#f4d43e"></i>30–34</span>
 <span><i class="dot" style="background:#f07832"></i>35–44</span>
 <span><i class="dot" style="background:#ed42c8"></i>≥45 dBZ</span>
</div>

<div id="viewer">
 <div class="vhead">
  <b id="vtitle">Cella radar</b>
  <div style="display:flex;gap:5px">
   <select id="mode">
    <option value="0">Voxel 3D</option>
    <option value="1">Iso-superficie</option>
    <option value="2">Holographic</option>
   </select>
   <button id="reset">Reset</button>
   <button id="close">Chiudi</button>
  </div>
 </div>
 <canvas id="scene"></canvas>
 <div class="vfoot">Trascina per ruotare · pizzica per zoom · superficie radar osservata, volume verticale stimato</div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(()=>{
'use strict';

const $=id=>document.getElementById(id);
const map=L.map('map',{preferCanvas:true}).setView([43,12],5);

L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',{
 maxZoom:17,
 attribution:'© OpenTopoMap · © OpenStreetMap'
}).addTo(map);

const radarLayer=L.layerGroup().addTo(map);
const centroidLayer=L.layerGroup().addTo(map);

let cells=[];
let selected=null;

const color=v=>v>=45?'#ed42c8':
 v>=35?'#f07832':
 v>=30?'#f4d43e':
 v>=25?'#24bd70':
 v>=15?'#397ee8':'#000000';

const number=(v,d=1)=>{
 const n=Number(v);
 return Number.isFinite(n)?n.toFixed(d):'—';
};

const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({
 '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
})[c]);

function popupContent(c,index){
 const track=c.track||{};
 const speed=Number(track.speed_kmh);
 const hasSpeed=Number.isFinite(speed);
 const area=Number(c.approx_area_km2);
 const areaText=Number.isFinite(area)?number(area)+' km²':'—';

 return `
 <div class="popup-title">${safe(c.id)}</div>
 <div class="popup-line"><b>${number(c.max_dbz)} dBZ</b> · massimo</div>
 <div class="popup-line">Media: ${number(c.mean_dbz)} dBZ</div>
 <div class="popup-line">Area eco: ${areaText}</div>
 <div class="popup-line">Centroide: ${number(c.lat,3)}°, ${number(c.lon,3)}°</div>
 ${hasSpeed?`<div class="popup-line">Velocità track: ${number(speed)} km/h</div>`:''}
 <div class="popup-note">Perimetro: area connessa con DBZH ≥25 dBZ. Non è una classificazione mesoscala.</div>
 ${c['3d_available']===true?`<button class="popup-action" id="open3d-${index}">Apri ricostruzione 3D</button>`:''}
 `;
}

function addCell(c,index){
 if(!Array.isArray(c.perimeter)||c.perimeter.length<3)return;
 const points=c.perimeter.filter(p=>
  Array.isArray(p)&&p.length>=2&&
  Number.isFinite(+p[0])&&Number.isFinite(+p[1])
 );
 if(points.length<3)return;

 const stroke=color(c.max_dbz);

 L.polygon(points,{
  color:stroke,
  weight:1.5,
  opacity:.95,
  fillColor:stroke,
  fillOpacity:.27,
  smoothFactor:0.5
 }).addTo(radarLayer);

 const marker=L.circleMarker([c.lat,c.lon],{
  radius:6,
  color:'#ffffff',
  weight:1.5,
  fillColor:stroke,
  fillOpacity:1
 }).addTo(centroidLayer);

 marker.bindPopup(popupContent(c,index),{maxWidth:260});

 marker.on('popupopen',()=>{
  const button=$('open3d-'+index);
  if(button)button.onclick=()=>open3D(c);
 });
}

function render(data){
 cells=Array.isArray(data.cells)?data.cells:[];
 radarLayer.clearLayers();
 centroidLayer.clearLayers();

 cells.forEach((c,i)=>{
  if(Number.isFinite(+c.lat)&&Number.isFinite(+c.lon))addCell(c,i);
 });

 $('status').textContent=
  'OPERA · '+(data.timestamp||'orario n/d')+
  ' · '+cells.length+' celle';

 if(cells.length){
  const bounds=cells
   .filter(c=>Number.isFinite(+c.lat)&&Number.isFinite(+c.lon))
   .map(c=>[+c.lat,+c.lon]);
  if(bounds.length)map.fitBounds(bounds,{padding:[25,25],maxZoom:7});
 }
}

async function load(){
 $('status').textContent='OPERA · aggiornamento';
 try{
  const response=await fetch('docs/data/iride.json?t='+Date.now(),{
   cache:'no-store'
  });
  if(!response.ok)throw Error('HTTP '+response.status);
  const data=await response.json();
  if(data.status!=='ok'||!Array.isArray(data.cells))
   throw Error('Dati non validi');
  render(data);
 }catch(error){
  $('status').textContent='OPERA · dati non disponibili';
  console.error(error);
 }
}

$('reload').onclick=load;/* =====================================================
   RENDERER 3D
   La texture alla base è la matrice DBZH osservata.
   La quota è una ricostruzione morfologica, non misurata.
   ===================================================== */

const viewer=$('viewer');
const canvas=$('scene');
const gl=canvas.getContext('webgl2',{
 antialias:true,
 alpha:false,
 powerPreference:'high-performance'
});

if(!gl){
 $('status').textContent='WebGL2 non disponibile';
 return;
}

const vertexShader=`#version 300 es
in vec2 position;
out vec2 uv;
void main(){
 uv=position*.5+.5;
 gl_Position=vec4(position,0.,1.);
}`;

const fragmentShader=`#version 300 es
precision highp float;

in vec2 uv;
out vec4 outputColor;

uniform vec2 resolution;
uniform vec3 cameraPosition;
uniform vec3 cameraRight;
uniform vec3 cameraUp;
uniform vec3 cameraForward;
uniform float fov;
uniform sampler2D radarTexture;
uniform int renderMode;

const vec3 BACKGROUND=vec3(.008,.014,.025);

vec4 radar(vec2 p){
 return texture(radarTexture,clamp(p,vec2(0.),vec2(1.)));
}

/* Altezza stimata in funzione della classe DBZH. */
float echoTop(vec3 c){
 if(c.b>c.r*1.22 && c.b>c.g*1.12)return 3.15;
 if(c.g>c.r*1.12 && c.g>c.b*1.05)return 2.75;
 if(c.r>.65 && c.g>.55 && c.b<.35)return 2.15;
 if(c.r>.65 && c.g<.48 && c.b<.35)return 1.65;
 if(c.r>.60 && c.b>.35 && c.g<.40)return 1.25;
 return 0.;
}

/* Volume derivato dalla stessa matrice della base. */
float densityAt(vec3 p,out vec3 cellColor){
 vec2 q=vec2((p.x+2.25)/4.5,(p.z+1.4)/2.8);
 vec4 sampleRadar=radar(q);
 cellColor=sampleRadar.rgb;

 if(sampleRadar.a<.08)return 0.;

 float top=echoTop(cellColor);
 if(top<=0.)return 0.;

 float h=p.y;
 if(h<.06||h>top)return 0.;

 float lower=smoothstep(.04,.22,h);
 float upper=1.-smoothstep(top*.82,top,h);

 float taper=1.-.30*(h/top);
 float density=lower*upper*taper;

 /* Modalità isosuperficie più definita. */
 if(renderMode==1)density=smoothstep(.35,.65,density);

 /* Holographic: intensità maggiore, senza sfocatura. */
 if(renderMode==2)density*=1.35;

 return density;
}

bool intersectBox(vec3 ro,vec3 rd,out float nearT,out float farT){
 vec3 low=vec3(-2.25,.05,-1.40);
 vec3 high=vec3(2.25,3.25,1.40);
 vec3 inv=1./rd;
 vec3 a=(low-ro)*inv;
 vec3 b=(high-ro)*inv;
 vec3 mn=min(a,b);
 vec3 mx=max(a,b);
 nearT=max(max(mn.x,mn.y),mn.z);
 farT=min(min(mx.x,mx.y),mx.z);
 return farT>max(nearT,0.);
}

void main(){
 vec2 screen=uv*2.-1.;
 screen.x*=resolution.x/resolution.y;

 vec3 direction=normalize(
  cameraForward+
  cameraRight*screen.x*fov+
  cameraUp*screen.y*fov
 );

 float nearT,farT;
 vec3 result=BACKGROUND;

 /* Intersezione con il piano radar inferiore. */
 float floorT=-1.;
 if(direction.y<-.0001){
  floorT=(.05-cameraPosition.y)/direction.y;
 }

 if(floorT>0.){
  vec3 floorPoint=cameraPosition+direction*floorT;
  if(abs(floorPoint.x)<=2.25&&abs(floorPoint.z)<=1.40){
   vec2 floorUV=vec2(
    (floorPoint.x+2.25)/4.5,
    (floorPoint.z+1.40)/2.8
   );
   vec4 base=radar(floorUV);
   result=mix(BACKGROUND,base.rgb,base.a);
  }
 }

 /* Ray marching del volume sopra la base radar. */
 if(intersectBox(cameraPosition,direction,nearT,farT)){
  float startT=max(nearT,0.);
  float endT=farT;
  if(floorT>startT)endT=min(endT,floorT);

  float stepSize=(endT-startT)/160.;
  float transparency=1.;
  vec3 volume=vec3(0.);

  for(int i=0;i<160;i++){
   float t=startT+(float(i)+.5)*stepSize;
   vec3 p=cameraPosition+direction*t;
   vec3 cellColor;
   float density=densityAt(p,cellColor);

   if(density>.015){
    float alpha=1.-exp(-density*stepSize*2.2);
    volume+=transparency*alpha*cellColor;
    transparency*=1.-alpha;
   }

   if(transparency<.025)break;
  }

  result=volume+transparency*result;
 }

 outputColor=vec4(result,1.);
}`;

function compileShader(type,source){
 const shader=gl.createShader(type);
 gl.shaderSource(shader,source);
 gl.compileShader(shader);
 if(!gl.getShaderParameter(shader,gl.COMPILE_STATUS))
  throw Error(gl.getShaderInfoLog(shader));
 return shader;
}

const program=gl.createProgram();
gl.attachShader(program,compileShader(gl.VERTEX_SHADER,vertexShader));
gl.attachShader(program,compileShader(gl.FRAGMENT_SHADER,fragmentShader));
gl.linkProgram(program);

if(!gl.getProgramParameter(program,gl.LINK_STATUS))
 throw Error(gl.getProgramInfoLog(program));

gl.useProgram(program);

const buffer=gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER,buffer);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([
 -1,-1,1,-1,-1,1,1,1
]),gl.STATIC_DRAW);

const position=gl.getAttribLocation(program,'position');
gl.enableVertexAttribArray(position);
gl.vertexAttribPointer(position,2,gl.FLOAT,false,0,0);

const uniform={};
[
 'resolution','cameraPosition','cameraRight','cameraUp',
 'cameraForward','fov','radarTexture','renderMode'
].forEach(name=>{
 uniform[name]=gl.getUniformLocation(program,name);
});

const texture=gl.createTexture();
gl.activeTexture(gl.TEXTURE0);
gl.bindTexture(gl.TEXTURE_2D,texture);

/* Campionamento netto: niente interpolazione sfocata. */
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.NEAREST);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.NEAREST);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
gl.uniform1i(uniform.radarTexture,0);

function radarColor(dbz){
 if(dbz>=45)return [237,66,200,255];
 if(dbz>=35)return [240,120,50,255];
 if(dbz>=30)return [244,212,62,255];
 if(dbz>=25)return [36,189,112,255];
 if(dbz>=15)return [57,126,232,255];
 return [0,0,0,0];
}

function uploadRadarMatrix(cell){
 const matrix=cell.grid_matrix;
 if(!Array.isArray(matrix)||matrix.length===0)
  throw Error('Matrice DBZH non presente');

 const height=matrix.length;
 const width=Math.max(...matrix.map(row=>
  Array.isArray(row)?row.length:0
 ));

 if(width===0)throw Error('Matrice DBZH vuota');

 const pixels=new Uint8Array(width*height*4);

 for(let y=0;y<height;y++){
  const row=matrix[y]||[];
  for(let x=0;x<width;x++){
   const value=Number(row[x]);
   const rgba=radarColor(Number.isFinite(value)?value:0);
   const offset=((height-1-y)*width+x)*4;
   pixels[offset]=rgba[0];
   pixels[offset+1]=rgba[1];
   pixels[offset+2]=rgba[2];
   pixels[offset+3]=rgba[3];
  }
 }

 gl.activeTexture(gl.TEXTURE0);
 gl.bindTexture(gl.TEXTURE_2D,texture);
 gl.pixelStorei(gl.UNPACK_ALIGNMENT,1);
 gl.texImage2D(
  gl.TEXTURE_2D,0,gl.RGBA,width,height,0,
  gl.RGBA,gl.UNSIGNED_BYTE,pixels
 );
}/* =====================================================
   CAMERA E CONTROLLI
   ===================================================== */

let yaw=-.35;
let pitch=.34;
let distance=7.1;
let activeCell=null;
let dragging=false;
let lastX=0,lastY=0;
let touchDistance=0;

function normalize(v){
 const length=Math.hypot(v[0],v[1],v[2])||1;
 return v.map(n=>n/length);
}

function cross(a,b){
 return [
  a[1]*b[2]-a[2]*b[1],
  a[2]*b[0]-a[0]*b[2],
  a[0]*b[1]-a[1]*b[0]
 ];
}

function resizeCanvas(){
 const rect=canvas.getBoundingClientRect();
 const ratio=Math.min(window.devicePixelRatio||1,1.5);
 canvas.width=Math.max(1,Math.round(rect.width*ratio));
 canvas.height=Math.max(1,Math.round(rect.height*ratio));
 gl.viewport(0,0,canvas.width,canvas.height);
}

function drawScene(){
 if(!activeCell||!viewer.classList.contains('open'))return;

 const width=canvas.width;
 const height=canvas.height;
 if(!width||!height)return;

 const target=[0,.95,0];
 const cp=Math.cos(pitch);
 const sp=Math.sin(pitch);
 const sy=Math.sin(yaw);
 const cy=Math.cos(yaw);

 const camera=[
  distance*cp*sy,
  target[1]+distance*sp,
  distance*cp*cy
 ];

 const forward=normalize([
  target[0]-camera[0],
  target[1]-camera[1],
  target[2]-camera[2]
 ]);

 const right=normalize(cross(forward,[0,1,0]));
 const up=normalize(cross(right,forward));

 gl.useProgram(program);
 gl.uniform2f(uniform.resolution,width,height);
 gl.uniform3fv(uniform.cameraPosition,camera);
 gl.uniform3fv(uniform.cameraRight,right);
 gl.uniform3fv(uniform.cameraUp,up);
 gl.uniform3fv(uniform.cameraForward,forward);
 gl.uniform1f(uniform.fov,Math.tan(34*Math.PI/180));
 gl.uniform1i(uniform.renderMode,Number($('mode').value)||0);

 gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
}

function open3D(cell){
 if(cell['3d_available']!==true){
  alert('Questa cella non è inclusa nelle 30 selezionate per il 3D.');
  return;
 }

 try{
  activeCell=cell;
  uploadRadarMatrix(cell);

  $('vtitle').textContent=
   cell.id+' · '+number(cell.max_dbz)+' dBZ';

  viewer.classList.add('open');
  resizeCanvas();
  drawScene();
 }catch(error){
  console.error(error);
  alert('Errore nella ricostruzione: '+error.message);
 }
}

$('mode').onchange=drawScene;

$('close').onclick=()=>{
 viewer.classList.remove('open');
 activeCell=null;
};

$('reset').onclick=()=>{
 yaw=-.35;
 pitch=.34;
 distance=7.1;
 drawScene();
};

window.addEventListener('resize',()=>{
 if(viewer.classList.contains('open')){
  resizeCanvas();
  drawScene();
 }
});

canvas.addEventListener('pointerdown',event=>{
 dragging=true;
 lastX=event.clientX;
 lastY=event.clientY;
 canvas.setPointerCapture(event.pointerId);
});

canvas.addEventListener('pointermove',event=>{
 if(!dragging)return;

 const dx=event.clientX-lastX;
 const dy=event.clientY-lastY;

 yaw-=dx*.006;
 pitch=Math.max(-.05,Math.min(1.05,pitch+dy*.004));

 lastX=event.clientX;
 lastY=event.clientY;
 drawScene();
});

canvas.addEventListener('pointerup',()=>dragging=false);
canvas.addEventListener('pointercancel',()=>dragging=false);

canvas.addEventListener('wheel',event=>{
 event.preventDefault();
 distance=Math.max(4.2,Math.min(13,distance+event.deltaY*.008));
 drawScene();
},{passive:false});

/* Zoom a due dita. */
canvas.addEventListener('touchstart',event=>{
 if(event.touches.length===2){
  touchDistance=Math.hypot(
   event.touches[0].clientX-event.touches[1].clientX,
   event.touches[0].clientY-event.touches[1].clientY
  );
 }
},{passive:true});

canvas.addEventListener('touchmove',event=>{
 if(event.touches.length!==2)return;

 event.preventDefault();

 const next=Math.hypot(
  event.touches[0].clientX-event.touches[1].clientX,
  event.touches[0].clientY-event.touches[1].clientY
 );

 if(touchDistance>0&&next>0){
  distance=Math.max(4.2,Math.min(13,distance*touchDistance/next));
  drawScene();
 }
 touchDistance=next;
},{passive:false});

canvas.addEventListener('touchend',()=>touchDistance=0,{passive:true});

load();

})();
</script>
</body>
</html>
