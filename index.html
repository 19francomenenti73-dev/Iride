<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>I.R.I.D.E. - Professional Radar 3D Engine</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --bg-deep: #02060f;
            --panel-bg: rgba(6, 14, 26, 0.95);
            --border-color: #162c46;
            --cyan-glow: #00d2ff;
            --pink-core: #ff0055;
            --text-main: #ffffff;
        }
        * { box-sizing: border-box; touch-action: none; }
        body { margin: 0; padding: 0; background: var(--bg-deep); color: var(--text-main); font-family: 'Segoe UI', system-ui, sans-serif; overflow: hidden; width: 100vw; height: 100vh; }

        #view-tracker { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; display: flex; flex-direction: column; }
        #header-tracker { height: 54px; background: var(--panel-bg); border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; padding: 0 16px; z-index: 10; backdrop-filter: blur(6px); }
        .brand-title { color: var(--cyan-glow); font-weight: 800; font-size: 18px; letter-spacing: 2px; }
        .brand-subtitle { font-size: 11px; color: #8a99ad; margin-left: 10px; }
        #map { flex-grow: 1; width: 100%; height: 100%; z-index: 1; }

        #view-3d { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2000; background: radial-gradient(circle at center, #071325 0%, #020408 100%); display: none; flex-direction: column; }
        #view-3d.active { display: flex; }

        #header-3d { background: var(--panel-bg); border-bottom: 1px solid var(--border-color); padding: 12px 16px; z-index: 10; }
        .telemetry-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
        .tele-title { font-size: 15px; font-weight: bold; color: var(--cyan-glow); }
        .btn-close-3d { background: #ff0055; color: #fff; border: none; padding: 6px 14px; border-radius: 4px; font-weight: bold; font-size: 11px; cursor: pointer; }
        .tele-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 16px; font-size: 11px; color: #94a3b8; border-top: 1px solid var(--border-color); padding-top: 6px; }
        .tele-item span { color: #fff; font-weight: bold; }

        #canvas-container-3d { flex-grow: 1; position: relative; width: 100%; height: 100%; overflow: hidden; }
        #canvas-cell-3d { width: 100% !important; height: 100% !important; display: block; }
        .footer-hint { position: absolute; bottom: 12px; width: 100%; text-align: center; font-size: 10px; color: #64748b; pointer-events: none; }
    </style>
</head>
<body>
    <div id="view-tracker">
        <div id="header-tracker">
            <div style="display: flex; align-items: baseline;">
                <div class="brand-title">I.R.I.D.E.</div>
                <div class="brand-subtitle">Professional Radar Engine</div>
            </div>
            <div style="font-size: 11px; color: #00ff66; font-weight: bold; background: #091b30; padding: 5px 10px; border-radius: 4px; border: 1px solid var(--border-color);">● TRACKER ATTIVO</div>
        </div>
        <div style="position: relative; flex-grow: 1; width: 100%; height: 100%;">
            <div id="map"></div>
        </div>
    </div>

    <div id="view-3d">
        <div id="header-3d">
            <div class="telemetry-top">
                <div>
                    <div id="h-core-id" class="tele-title">Core-Cell</div>
                    <div style="font-size: 11px; color: var(--pink-core);" id="t-dbz-main">Riflettività: --</div>
                </div>
                <button class="btn-close-3d" onclick="closeCell3DView()">CHIUDI ✕</button>
            </div>
            <div class="tele-grid">
                <div class="tele-item">VIL: <span id="t-vil">--</span></div>
                <div class="tele-item">Echo top: <span id="t-top">--</span></div>
                <div class="tele-item">Velocità: <span id="t-vel">--</span></div>
                <div class="tele-item">Direzione: <span id="t-dir">--</span></div>
            </div>
        </div>

        <div id="canvas-container-3d">
            <canvas id="canvas-cell-3d"></canvas>
            <div class="footer-hint">Trascina per ruotare la struttura · Dati grid_matrix 2D</div>
        </div>
    </div>
        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const map = L.map('map', { zoomControl: false, attributionControl: false }).setView([42.0, 12.5], 6);
        L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', { maxZoom: 17 }).addTo(map);

        let activeCellData = null;

        const pathSegments = window.location.pathname.split('/').filter(Boolean);
        const jsonUrl = window.location.hostname.includes('github.io') && pathSegments.length > 0 
            ? `/${pathSegments[0]}/data/iride_database.json` 
            : 'data/iride_database.json';

        fetch(jsonUrl)
            .then(res => res.ok ? res.json() : Promise.reject('JSON non trovato'))
            .then(data => {
                if (data?.radar_tile_path) {
                    L.tileLayer(`https://tilecache.rainviewer.com${data.radar_tile_path}/256/{z}/{x}/{y}/2/1_1.png`, {
                        opacity: 0.75, maxZoom: 18
                    }).addTo(map);
                }
                if (data?.cells && data.cells.length > 0) {
                    renderCentroids(data.cells);
                } else {
                    loadFallbackCell();
                }
            })
            .catch(err => {
                console.warn("[I.R.I.D.E.] JSON non trovato, carico cella di test dimostrativa:", err);
                loadFallbackCell();
            });

        function loadFallbackCell() {
            // Matrice di test mock rigorosa per testare subito la struttura 3D perfetta
            const mockMatrix = Array(16).fill(0).map(() => Array(16).fill(10));
            for(let r=5; r<11; r++) {
                for(let c=5; c<11; c++) {
                    let dist = Math.hypot(r-8, c-8);
                    mockMatrix[r][c] = Math.max(20, 70 - (dist * 7));
                }
            }
            const fallbackCell = {
                id: "Core-51712-MOCK",
                lat: 41.89, lon: 12.49,
                max_dbz: 58.4,
                severity: { vil: 69.6, echo_top: 12.7 },
                kinematics: { velocity_kmh: 47, direction_deg: 321 },
                grid_matrix: mockMatrix
            };
            renderCentroids([fallbackCell]);
        }

        function renderCentroids(cells) {
            cells.forEach(cell => {
                const icon = L.divIcon({
                    className: 'custom-centroid',
                    html: `<div style="width:28px; height:28px; border:2px solid #ff0055; border-radius:50%; animation: pulse 1.4s infinite; background: rgba(255,0,85,0.3); display:flex; align-items:center; justify-content:center;"><div style="width:8px; height:8px; background:#ff0055; border-radius:50%;"></div></div>`,
                    iconSize: [28, 28]
                });
                const marker = L.marker([cell.lat, cell.lon], { icon }).addTo(map);
                marker.on('click', () => openCell3DView(cell));

                if (cell.vectors?.real) L.polyline(cell.vectors.real, { color: '#00d2ff', weight: 2, dashArray: '4,4' }).addTo(map);
                if (cell.vectors?.predictive_noaa) L.polyline(cell.vectors.predictive_noaa, { color: '#ff0055', weight: 1.5 }).addTo(map);
            });
        }

        function openCell3DView(cell) {
            activeCellData = cell;
            document.getElementById('h-core-id').innerText = cell.id || "Core-Cell";
            document.getElementById('t-dbz-main').innerText = `Riflettività: ${cell.max_dbz || 0} dBZ`;
            document.getElementById('t-vil').innerText = `${cell.severity?.vil || 0} kg/m²`;
            document.getElementById('t-top').innerText = `${cell.severity?.echo_top || 0} km`;
            document.getElementById('t-vel').innerText = `${cell.kinematics?.velocity_kmh || 0} km/h`;
            document.getElementById('t-dir').innerText = `${cell.kinematics?.direction_deg || 0}°`;
            
            document.getElementById('view-3d').classList.add('active');
            setTimeout(initCell3DEngine, 50);
        }

        function closeCell3DView() {
            document.getElementById('view-3d').classList.remove('active');
        }

        let cellRenderer = null, cellScene = null, cellCamera = null, cellRootGroup = null;
        let isDragging = false, prevMouse = { x: 0, y: 0 };
        let rotY = 0.6, tiltX = 0.45;

        function initCell3DEngine() {
            const canvas = document.getElementById('canvas-cell-3d');
            const container = document.getElementById('canvas-container-3d');
            const width = container.clientWidth;
            const height = container.clientHeight;

            if (cellRenderer) {
                cellRenderer.setSize(width, height);
                cellCamera.aspect = width / height;
                cellCamera.updateProjectionMatrix();
                return;
            }

            cellRenderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
            cellRenderer.setSize(width, height);
            cellRenderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

            cellScene = new THREE.Scene();
            cellCamera = new THREE.PerspectiveCamera(40, width / height, 0.1, 1000);
            cellCamera.position.set(0, 16, 28);
            cellCamera.lookAt(0, 0, 0);

            cellScene.add(new THREE.AmbientLight(0xffffff, 1.8));
            const light = new THREE.DirectionalLight(0xffffff, 2.2);
            light.position.set(15, 35, 20);
            cellScene.add(light);

            cellRootGroup = buildProfessionalRadarEngine(activeCellData?.grid_matrix);
            cellScene.add(cellRootGroup);

            container.addEventListener('pointerdown', (e) => {
                isDragging = true;
                prevMouse = { x: e.clientX, y: e.clientY };
            });

            window.addEventListener('pointermove', (e) => {
                if (!isDragging || !document.getElementById('view-3d').classList.contains('active')) return;
                const dx = e.clientX - prevMouse.x;
                const dy = e.clientY - prevMouse.y;

                rotY += dx * 0.008;
                tiltX = Math.max(0.1, Math.min(0.7, tiltX + dy * 0.008));

                if (cellRootGroup) {
                    cellRootGroup.rotation.y = rotY;
                    cellRootGroup.rotation.x = tiltX;
                }
                prevMouse = { x: e.clientX, y: e.clientY };
            });

            window.addEventListener('pointerup', () => { isDragging = false; });
            window.addEventListener('resize', () => {
                if (!container || !cellRenderer) return;
                const w = container.clientWidth;
                const h = container.clientHeight;
                cellRenderer.setSize(w, h);
                cellCamera.aspect = w / h;
                cellCamera.updateProjectionMatrix();
            });

            animateCell3D();
        }

        // Scala colori dBZ radar standard ufficiale
        function getDbzColorHex(dbz) {
            if (dbz >= 68) return 0xff00ff; // Magenta
            if (dbz >= 58) return 0xff0044; // Rosso
            if (dbz >= 50) return 0xff5500; // Arancione
            if (dbz >= 42) return 0xffcc00; // Giallo
            if (dbz >= 32) return 0x00e64d; // Verde
            if (dbz >= 22) return 0x00b4d8; // Azzurro
            return 0x0055ff; // Blu
        }

        // MOTORE PROFESSIONALE STRUTTURATO CON BORDI NETTI E ANCORAGGIO 2D
        function buildProfessionalRadarEngine(matrix) {
            const masterGroup = new THREE.Group();
            masterGroup.rotation.x = tiltX;
            masterGroup.rotation.y = rotY;

            let rows = 16, cols = 16;
            if (matrix && Array.isArray(matrix)) {
                rows = matrix.length;
                cols = matrix[0].length;
            }

            const pSize = 0.85;
            const originX = (cols * pSize) / 2;
            const originZ = (rows * pSize) / 2;

            // 1. Piattaforma di Base Radar 2D al suolo (Doppio layer wireframe pulito)
            const groundGroup = new THREE.Group();
            groundGroup.position.y = -2.6;

            for (let layer = 0; layer < 2; layer++) {
                for (let r = 0; r < rows; r++) {
                    for (let c = 0; c < cols; c++) {
                        const geom = new THREE.BoxGeometry(pSize * 0.96, 0.12, pSize * 0.96);
                        const mat = new THREE.MeshBasicMaterial({ 
                            color: 0x00d2ff, 
                            wireframe: true, 
                            transparent: true, 
                            opacity: layer === 0 ? 0.35 : 0.15 
                        });
                        const box = new THREE.Mesh(geom, mat);
                        box.position.set(c * pSize - originX, -layer * 0.15, r * pSize - originZ);
                        groundGroup.add(box);
                    }
                }
            }
            masterGroup.add(groundGroup);

            // 2. Colonne Verticali Strutturate con Spigoli Vivi (EdgesGeometry)
            const stackGroup = new THREE.Group();
            const maxLevels = 14;

            if (matrix && Array.isArray(matrix)) {
                for (let r = 0; r < rows; r++) {
                    for (let c = 0; c < cols; c++) {
                        let baseDbz = matrix[r][c] || 10;
                        if (baseDbz < 18) continue;

                        let levelsCount = Math.min(maxLevels, Math.max(2, Math.floor((baseDbz / 70.0) * maxLevels)));

                        for (let h = 0; h < levelsCount; h++) {
                            let currentDbz = baseDbz + (h * 1.6);
                            let colorHex = getDbzColorHex(currentDbz);

                            let boxGeom = new THREE.BoxGeometry(pSize * 0.92, 0.38, pSize * 0.92);
                            let boxMat = new THREE.MeshStandardMaterial({ 
                                color: colorHex, 
                                transparent: true, 
                                opacity: 0.9, 
                                roughness: 0.2 
                            });

                            let mesh = new THREE.Mesh(boxGeom, boxMat);

                            // Bordi netti e scuri per separare nettamente i blocchi (stile CAD/Radar Pro)
                            let edges = new THREE.EdgesGeometry(boxGeom);
                            let lineMat = new THREE.LineBasicMaterial({ color: 0x010409, linewidth: 2 });
                            let wireframeLines = new THREE.LineSegments(edges, lineMat);
                            mesh.add(wireframeLines);

                            let x = c * pSize - originX;
                            let z = r * pSize - originZ;
                            let y = (h * 0.4) - 2.2;

                            mesh.position.set(x, y, z);
                            stackGroup.add(mesh);
                        }
                    }
                }
            }

            masterGroup.add(stackGroup);
            return masterGroup;
        }

        function animateCell3D() {
            requestAnimationFrame(animateCell3D);
            if (!isDragging && document.getElementById('view-3d'].classList.contains('active')) {
                rotY += 0.0004;
                if (cellRootGroup) cellRootGroup.rotation.y = rotY;
            }
            if (cellRenderer && cellScene && cellCamera) {
                cellRenderer.render(cellScene, cellCamera);
            }
        }
    </script>
</body>
</html>
