<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101d2b">
<title>I.R.I.D.E. | Nowcasting Italia</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{
 --bg:#101d2b;
 --surface:#17283a;
 --surface2:#1c3045;
 --border:#30465b;
 --text:#e8eff6;
 --muted:#9aabba;
 --accent:#48a9d5;
 --blue:#397ee8;
 --green:#24bd70;
 --yellow:#f4d43e;
 --orange:#f07832;
 --magenta:#ed42c8;
 --real:#36b6df;
 --forecast:#e6a34a;
}
*{box-sizing:border-box}
html,body{
 margin:0;width:100%;height:100%;overflow:hidden;
 background:var(--bg);color:var(--text);
 font:14px system-ui,-apple-system,"Segoe UI",sans-serif
}
button,select{
 background:var(--surface2);color:var(--text);
 border:1px solid var(--border);border-radius:5px;
 padding:8px 11px;font:inherit
}
button{cursor:pointer}
button:hover{border-color:var(--accent)}
button:disabled{opacity:.45;cursor:not-allowed}
header{
 height:62px;background:#142438;border-bottom:1px solid var(--border);
 display:flex;align-items:center;justify-content:space-between;
 padding:0 20px;gap:14px
}
.brand{display:flex;align-items:center;gap:13px;min-width:0}
.brand-mark{
 width:36px;height:36px;border:1px solid #4c91b4;
 border-radius:6px;display:grid;place-items:center;
 color:#8ccbe8;font-size:17px;font-weight:800
}
.brand-name{
 font-size:17px;font-weight:750;letter-spacing:.8px;
 color:#48a9ef;animation:iridePulse 3s ease-in-out infinite
}
@keyframes iridePulse{50%{color:#8edbff;text-shadow:0 0 12px #397ee888}}
@media(prefers-reduced-motion:reduce){.brand-name{animation:none}}
.brand-sub{
 color:var(--muted);font-size:9px;letter-spacing:1.2px;
 margin-top:2px
}
.header-right{display:flex;align-items:center;gap:16px}
#status{
 color:#b8c7d5;font-size:11px;text-align:right;
 line-height:1.5
}
.status-dot{
 display:inline-block;width:7px;height:7px;border-radius:50%;
 background:#42bd89;margin-right:6px
}
.app-shell{
 height:calc(100% - 62px);
 display:grid;grid-template-rows:48px minmax(0,1fr);
 min-height:0
}
.toolbar{
 display:flex;align-items:center;justify-content:space-between;
 gap:12px;padding:0 18px;background:#17283a;
 border-bottom:1px solid var(--border)
}
.breadcrumb{font-size:11px;color:var(--muted)}
.breadcrumb strong{color:var(--text);font-weight:650}
.toolbar-actions{display:flex;gap:7px;align-items:center}
.toolbar button{font-size:11px;padding:6px 10px}
#reload{border-color:#477d9a}
.workspace{
 display:grid;grid-template-columns:minmax(0,1fr);
 gap:12px;padding:12px;min-height:0;overflow:hidden
}
.map-panel{
 background:var(--surface);border:1px solid var(--border);
 border-radius:7px;min-height:0;overflow:hidden;
 display:flex;flex-direction:column;position:relative
}
.panel-heading{
 height:42px;flex:0 0 42px;display:flex;
 align-items:center;justify-content:space-between;
 padding:0 13px;border-bottom:1px solid var(--border);
 background:#1a2c40
}
.panel-heading strong{font-size:12px;font-weight:700}
.panel-heading small{font-size:10px;color:var(--muted)}
.map-frame{position:relative;flex:1;min-height:0}
#map{position:absolute;inset:0;background:#d5dce2}
.leaflet-image-layer.iride-radar-raster{
 filter:saturate(1.28) contrast(1.22) brightness(1.06)
}
.map-overlay-tools{
 position:absolute;z-index:600;right:12px;top:12px;
 display:flex;flex-direction:column;gap:6px
}
.map-overlay-tools button{
 background:#17283aeb;font-size:10px;padding:7px 9px;
 box-shadow:0 1px 4px #0003
}
.map-legend{
 min-height:42px;display:flex;align-items:center;
 justify-content:center;gap:15px;flex-wrap:wrap;
 padding:7px 10px;border-top:1px solid var(--border);
 background:#17283a
}
.legend-item{
 display:flex;align-items:center;gap:5px;
 color:#c5d1dc;font-size:10px;white-space:nowrap
}
.legend-swatch{width:10px;height:10px;border-radius:2px}
.leaflet-popup-content-wrapper{
 background:#17283a;color:var(--text);
 border:1px solid #49647a;border-radius:6px
}
.leaflet-popup-tip{background:#17283a}
.leaflet-popup-content{margin:12px;min-width:190px}
.popup-title{font-weight:750;font-size:13px;margin-bottom:8px}
.popup-line{font-size:11px;color:#d0dce6;margin:5px 0}
.popup-note{
 font-size:9px;color:var(--muted);margin-top:8px;line-height:1.4
}
.popup-action{
 width:100%;margin-top:10px;background:#28516a;
 border-color:#5599bd;color:white;font-weight:700
}
#viewer{
 display:none;position:fixed;inset:0;z-index:2000;
 background:#101a27;flex-direction:column
}
#viewer.open{display:flex}
.vhead{
 min-height:58px;flex-shrink:0;background:#17283a;
 border-bottom:1px solid var(--border);
 display:flex;align-items:center;justify-content:space-between;
 padding:7px 14px;gap:8px
}
#vtitle{font-size:12px;font-weight:750}
.vcontrols{display:flex;gap:6px;align-items:center}
.vcontrols select,.vcontrols button{font-size:11px;padding:8px 9px}
#scene{
 display:block;width:100%;height:100%;flex:1;min-height:0;
 touch-action:none
}
.vfoot{
 min-height:38px;display:flex;align-items:center;
 padding:0 14px;background:#17283a;
 border-top:1px solid var(--border);
 color:var(--muted);font-size:10px
}
@media(max-width:900px){
 .workspace{grid-template-columns:minmax(0,1fr)}
}
@media(max-width:650px){
 header{height:72px;padding:0 10px;gap:8px}
 .brand{flex:1;gap:8px}
 .brand>div:last-child{min-width:0}
 .header-right{flex:0 0 104px;max-width:32%}
 .brand-mark{width:30px;height:30px}
 .brand-name{font-size:15px}
 .brand-sub{
  display:block;font-size:7px;letter-spacing:.45px;
  line-height:1.4;margin-top:3px;overflow-wrap:normal
 }
 #status{font-size:8px;overflow-wrap:anywhere}
 .app-shell{
  height:calc(100% - 72px);
  grid-template-rows:42px minmax(0,1fr)
 }
 .toolbar{padding:0 9px}
 .breadcrumb{display:none}
 .toolbar-actions{width:100%;justify-content:space-between}
 .toolbar button{font-size:10px;padding:6px 8px}
 .workspace{
  display:flex;flex-direction:column;gap:7px;
  padding:4px;overflow:hidden
 }
 .map-panel{flex:1;min-height:0}
 .map-legend{gap:9px}
 .legend-item{font-size:9px}
 .vhead{min-height:54px;padding:6px}
 #vtitle{font-size:10px;max-width:90px}
 .vcontrols{gap:3px}
 .vcontrols select,.vcontrols button{font-size:10px;padding:7px 5px}
}
</style>
</head>
<body>
<header>
 <div class="brand">
  <div class="brand-mark">I</div>
  <div>
   <div class="brand-name">I.R.I.D.E.</div>
   <div class="brand-sub">INTEGRATED RADAR IMAGING &amp; DETECTION ENGINE</div>
  </div>
 </div>
 <div class="header-right">
  <div id="status"><span class="status-dot"></span>OPERA · caricamento</div>
 </div>
</header>
<div class="app-shell">
 <div class="toolbar">
  <div class="breadcrumb">NOWCASTING ITALIA / <strong>RADAR EUROPA</strong></div>
  <div class="toolbar-actions">
   <button id="vectorsToggle">Vettori: ON</button>
   <button id="mesoToggle">Mesoscala: ON</button>
   <button id="cellsToggle">Celle: ON</button>
   <button id="reload">Aggiorna</button>
  </div>
 </div>
 <main class="workspace">
  <section class="map-panel">
   <div class="panel-heading">
    <strong>RADAR COMPOSITO OPERA · DBZH</strong>
    <small id="map-time">Prodotto: in attesa</small>
   </div>
   <div class="map-frame">
    <div id="map"></div>
    <div class="map-overlay-tools">
     <button id="fitRegion">INTERA AREA</button>
    </div>
   </div>
   <div class="map-legend">
    <div class="legend-item"><span class="legend-swatch" style="background:#397ee8"></span>15–25</div>
    <div class="legend-item"><span class="legend-swatch" style="background:#24bd70"></span>25–30</div>
    <div class="legend-item"><span class="legend-swatch" style="background:#f4d43e"></span>30–35</div>
    <div class="legend-item"><span class="legend-swatch" style="background:#f07832"></span>35–45</div>
    <div class="legend-item"><span class="legend-swatch" style="background:#ed42c8"></span>≥45 dBZ</div>
   </div>
  </section>
 </main>
</div>
<div id="viewer">
 <div class="vhead">
  <b id="vtitle">RICOSTRUZIONE RADAR</b>
  <div class="vcontrols">
   <select id="mode">
    <option value="0">Volume V11</option>
    <option value="1">Iso-superficie</option>
    <option value="2">Holographic</option>
   </select>
   <button id="reset">RESET</button>
   <button id="close">CHIUDI</button>
  </div>
 </div>
 <canvas id="scene"></canvas>
 <div class="vfoot">Quota ricostruita da DBZH 2D · non misurata</div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
(()=>{
'use strict';

const $=id=>document.getElementById(id);
const finite=v=>v!==null&&v!==undefined&&v!==''&&Number.isFinite(Number(v));
const fmt=(v,d=1)=>finite(v)?Number(v).toFixed(d):'—';
const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({
 '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
})[c]);

const map=L.map('map',{
 preferCanvas:true,zoomControl:true,minZoom:3,maxZoom:12
}).setView([49,11],4);

L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',{
 maxZoom:17,attribution:'© OpenTopoMap · © OpenStreetMap'
}).addTo(map);

const radarLayer=L.layerGroup().addTo(map);
const cellLayer=L.layerGroup().addTo(map);
const centroidLayer=L.layerGroup().addTo(map);
const vectorLayer=L.layerGroup().addTo(map);
const mesoLayer=L.layerGroup().addTo(map);

map.createPane('motion');
map.getPane('motion').style.zIndex=460;
map.createPane('mesoscale');
map.getPane('mesoscale').style.zIndex=430;
map.createPane('cellTargets');
map.getPane('cellTargets').style.zIndex=480;

const motionRenderer=L.svg({pane:'motion'});
const mesoRenderer=L.svg({pane:'mesoscale'});
const cellRenderer=L.svg({pane:'cellTargets'});

new ResizeObserver(()=>map.invalidateSize()).observe($('map'));const REGION_BOUNDS=[[30,-15],[72,38]];
let radarImage=null;
let cells=[];
let currentData=null;
let showVectors=true;
let showCells=true;
let showMeso=true;
let jsonLocation='docs/data/iride.json';
let webgl2Available=true;

const color=v=>v>=45?'#ed42c8':
 v>=35?'#f07832':v>=30?'#f4d43e':
 v>=25?'#24bd70':v>=15?'#397ee8':'#000';

function vectorIsUsable(c){
 const v=c.vectors||{};
 const t=c.track||{};
 const obs=Array.isArray(t.observations)?t.observations:[];
 const speed=Number(t.speed_kmh);
 const interval=Number(t.observed_interval_minutes);
 if(obs.length<3)return false;
 if(!Array.isArray(v.real)||v.real.length!==2)return false;
 if(!Array.isArray(v.predictive_180m)||v.predictive_180m.length!==2)return false;
 if(!Number.isFinite(speed)||speed<5||speed>90)return false;
 if(!Number.isFinite(interval)||interval<5||interval>45)return false;
 if(t.forecast_status!=='experimental_consistent_motion_extrapolation')return false;
 const realEnd=v.real[1];
 const forecastStart=v.predictive_180m[0];
 if(!validPoint(realEnd)||!validPoint(forecastStart))return false;
 return pointDistanceKm(realEnd,forecastStart)<=2;
}

function validPoint(p){
 return Array.isArray(p)&&p.length>=2&&finite(p[0])&&finite(p[1])&&
  Math.abs(Number(p[0]))<=90&&Math.abs(Number(p[1]))<=180;
}

function pointDistanceKm(a,b){
 const rad=Math.PI/180;
 const p1=Number(a[0])*rad,p2=Number(b[0])*rad;
 const dp=(Number(b[0])-Number(a[0]))*rad;
 const dl=(Number(b[1])-Number(a[1]))*rad;
 const q=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;
 return 6371*2*Math.asin(Math.min(1,Math.sqrt(q)));
}

function observedPath(c){
 const obs=c.track?.observations||[];
 const path=[];
 let last=null;
 for(const o of obs){
  const point=[Number(o.lat),Number(o.lon)];
  const time=Date.parse(o.timestamp);
  if(!validPoint(point)||!Number.isFinite(time)){
   path.length=0;last=null;continue;
  }
  if(last){
   const minutes=(time-last.time)/60000;
   const speed=pointDistanceKm(last.point,point)*60/minutes;
   if(minutes<=0||minutes>45||speed>140)path.length=0;
  }
  path.push(point);
  last={point,time};
 }
 return path.length>=2?path:[];
}

function arrow(points,color,dashed=false,cell=null){
 if(points.length<2)return;
 const options={
  pane:'motion',renderer:motionRenderer,
  interactive:false,lineCap:'round',lineJoin:'round'
 };
 L.polyline(points,{
  ...options,color:'#081421',weight:6,opacity:.85
 }).addTo(vectorLayer);
 L.polyline(points,{
  ...options,color,weight:3,opacity:1,
  dashArray:dashed?'8 6':null
 }).addTo(vectorLayer);

 const a=map.latLngToLayerPoint(points.at(-2));
 const b=map.latLngToLayerPoint(points.at(-1));
 const angle=Math.atan2(b.y-a.y,b.x-a.x),size=10;
 const wings=[-.55,.55].map(d=>map.layerPointToLatLng(
  L.point(b.x-size*Math.cos(angle+d),b.y-size*Math.sin(angle+d))
 ));
 L.polyline([wings[0],points.at(-1),wings[1]],{
  ...options,color,weight:3
 }).addTo(vectorLayer);

 if(cell){
  const hit=L.polyline(points,{
   ...options,interactive:true,bubblingMouseEvents:false,
   weight:22,opacity:0
  }).addTo(vectorLayer);
  bindCellPopup(hit,cell);
 }
}function drawVector(c){
 arrow(observedPath(c),'#47e6ff',false,c);
 if(vectorIsUsable(c)){
  arrow(c.vectors.predictive_180m,'#ffbe54',true,c);
 }
}

function drawMeso(c,index){
 const cls=c.mesoscale_classification||{};
 if(!Array.isArray(c.perimeter)||c.perimeter.length<3||
    !c.perimeter.every(validPoint))return;
 if(!cls.class||cls.class==='unclassified_echo'||
    cls.class==='isolated_cell_candidate')return;
 const line=cls.class==='squall_line_candidate'?'#ffad42':
  cls.class==='mcs_candidate'?'#ee8cff':'#68e6db';
 L.polygon(c.perimeter,{
  pane:'mesoscale',renderer:mesoRenderer,
  color:line,weight:2,dashArray:'6 5',fillOpacity:.035
 }).bindPopup(
  '<b>'+safe(cls.label)+'</b>'+
  '<br>Area di verifica morfologica · candidata da DBZH 2D'+
  '<br>Il contorno è un inviluppo orientato, non il bordo esatto dell’eco.'
 ).addTo(mesoLayer);
}

function popupContent(c,index){
 const t=c.track||{};
 const area=Number(c.approx_area_km2);
 const classification=c.mesoscale_classification||{};
 const morphology=classification.label||c.morphology?.label||'Non classificata';
 const vector=vectorIsUsable(c);
 return `
 <div class="popup-title">${safe(c.track_id||c.id||'Cella')}</div>
 <div class="popup-line"><b>${fmt(c.max_dbz)} dBZ</b> · massimo radar non validato</div>
 <div class="popup-line">Media: ${fmt(c.mean_dbz)} dBZ</div>
 <div class="popup-line">Area eco: ${Number.isFinite(area)?fmt(area)+' km²':'—'}</div>
 <div class="popup-line">Centroide: ${fmt(c.lat,3)}°, ${fmt(c.lon,3)}°</div>
 ${vector?`<div class="popup-line">Moto osservato: ${fmt(t.speed_kmh)} km/h</div>`:''}
 <div class="popup-line">Mesoscala: ${safe(morphology)}</div>
 <div class="popup-note">Classificazione candidata da DBZH 2D, non confermata. Il 3D rappresenta una ricostruzione morfologica.</div>
 ${c['3d_available']===true&&webgl2Available?`<button class="popup-action" data-open3d="true">APRI RICOSTRUZIONE 3D</button>`:''}
 `;
}

function bindCellPopup(layer,c){
 layer.bindPopup(()=>popupContent(c),{maxWidth:300,autoPan:true});
 layer.on('popupopen',event=>{
  const button=event.popup.getElement()?.querySelector('[data-open3d]');
  if(button)button.onclick=event=>{
   event.preventDefault();
   event.stopPropagation();
   map.closePopup();
   open3D(c);
  };
 });
}

function addCell(c,index){
 const stroke=color(Number(c.max_dbz));
 const centre=[Number(c.lat),Number(c.lon)];
 const hit=L.circleMarker(centre,{
  pane:'cellTargets',renderer:cellRenderer,
  radius:22,stroke:false,fillColor:'#ffffff',fillOpacity:0.001,
  interactive:true,bubblingMouseEvents:false
 }).addTo(centroidLayer);
 L.circleMarker(centre,{
  pane:'cellTargets',renderer:cellRenderer,
  radius:9,color:'#ffffff',weight:2.5,
  fillColor:stroke,fillOpacity:0,interactive:false
 }).addTo(centroidLayer);
 bindCellPopup(hit,c);
 if(showVectors)drawVector(c);
}

function overlayUrl(path){
 if(!path)return '';
 const value=String(path).trim();
 if(/^https?:\/\//i.test(value))return value;
 const name=value.replace(/^\.?\//,'').replace(/^docs\//,'').replace(/^data\//,'');
 return new URL(name,new URL(jsonLocation,document.baseURI)).href;
}

let loadingRadar=false;
let fallbackActive=false;
let radarAttribution='';
let fallbackTime=null;
const originalLegend=document.querySelector('.map-legend').innerHTML;
const MAX_RADAR_AGE_MIN=90;
function freshTimestamp(timestamp){
 const value=Date.parse(timestamp);
 const age=(Date.now()-value)/60000;
 return Number.isFinite(value)&&age>=-5&&age<=MAX_RADAR_AGE_MIN;
}
function setRadarCredit(credit){
 if(radarAttribution)map.attributionControl.removeAttribution(radarAttribution);
 radarAttribution=credit;
 if(credit)map.attributionControl.addAttribution(credit);
}
function clearRadar(){
 currentData=null;cells=[];
 radarLayer.clearLayers();cellLayer.clearLayers();centroidLayer.clearLayers();
 vectorLayer.clearLayers();mesoLayer.clearLayers();radarImage=null;
 $('viewer').classList.remove('open');
}
async function requestJson(url){
 const controller=new AbortController();
 const timer=setTimeout(()=>controller.abort(),15000);
 try{
  const response=await fetch(url,{cache:'no-store',signal:controller.signal});
  if(!response.ok)throw Error('HTTP '+response.status);
  return await response.json();
 }finally{clearTimeout(timer);}
}
function checkImage(url){
 return new Promise((resolve,reject)=>{
  const picture=new Image();
  const timer=setTimeout(()=>{picture.onload=picture.onerror=null;reject(Error('Timeout radar'));},15000);
  picture.onload=()=>{clearTimeout(timer);resolve();};
  picture.onerror=()=>{clearTimeout(timer);reject(Error('Immagine radar non disponibile'));};
  picture.src=url;
 });
}
async function showRainViewer(){
 const data=await requestJson('https://api.rainviewer.com/public/weather-maps.json');
 const host=new URL(data.host);
 if(host.protocol!=='https:'||!host.hostname.endsWith('.rainviewer.com'))
  throw Error('Host RainViewer non valido');
 const frames=(data.radar?.past||[]).filter(frame=>
  Number.isFinite(frame.time)&&typeof frame.path==='string'&&
  /^\/v2\/radar\/[a-zA-Z0-9_-]+$/.test(frame.path)&&
  freshTimestamp(new Date(frame.time*1000).toISOString()));
 frames.sort((a,b)=>b.time-a.time);
 if(!frames.length)throw Error('RainViewer non aggiornato');
 const frame=frames[0];
 const base=host.origin+frame.path;
 await checkImage(base+'/256/5/17/11/2/0_0.png');
 clearRadar();
 fallbackActive=true;
 fallbackTime=new Date(frame.time*1000).toISOString();
 setRadarCredit('Weather data by <a href="https://www.rainviewer.com/" target="_blank" rel="noopener">RainViewer</a>');
 const tiles=L.tileLayer(base+'/256/{z}/{x}/{y}/2/0_0.png',{
  tileSize:256,maxNativeZoom:7,maxZoom:12,opacity:.85,
  updateWhenIdle:true,updateWhenZooming:false,keepBuffer:1
 });
 tiles.on('tileerror',()=>{
  if(fallbackActive)$('status').textContent='RainViewer · copertura parziale o errore tessere';
 });
 tiles.addTo(radarLayer);
 document.querySelector('.map-legend').textContent=
  'RainViewer · palette Universal Blue · sola mappa radar · celle e 3D sospesi';
 $('status').textContent='RainViewer · riserva 2D · '+fallbackTime;
 $('map-time').textContent='Fotogramma: '+fallbackTime+' · orari dei singoli radar variabili';
}

function render(data){
 if(!freshTimestamp(data.timestamp)){
  clearRadar();load();return;
 }
 fallbackActive=false;fallbackTime=null;
 document.querySelector('.map-legend').innerHTML=originalLegend;
 const dpc=data.source?.provider==='Radar-DPC';
 setRadarCredit(dpc?
  '<a href="https://radar.protezionecivile.it/">Radar-DPC</a> · <a href="https://creativecommons.org/licenses/by-sa/4.0/">CC BY-SA 4.0</a> · elaborazione I.R.I.D.E.':
  '<a href="https://www.eumetnet.eu/observations/weather-radar-network/">EUMETNET OPERA</a> · <a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a> · elaborazione I.R.I.D.E.');
 currentData=data;
 cells=Array.isArray(data.cells)?data.cells:[];
 radarLayer.clearLayers();
 cellLayer.clearLayers();
 centroidLayer.clearLayers();
 vectorLayer.clearLayers();
 mesoLayer.clearLayers();

 if(radarImage){
  map.removeLayer(radarImage);
  radarImage=null;
 }

 const overlay=data.radar_overlay;
 if(overlay?.image&&Array.isArray(overlay.bounds)){
  const url=overlayUrl(overlay.image);
  radarImage=L.imageOverlay(url+'?t='+Date.now(),overlay.bounds,{
   opacity:1.0,className:'iride-radar-raster',
   interactive:false,crossOrigin:false
  }).addTo(radarLayer);

     transparency*=1.-alpha;
    }
    if(transparency<.018)break;
   }
   result=volume+transparency*result;
  }
 }
 outputColor=vec4(result,1.);
}`));
gl.linkProgram(v11Program);
if(!gl.getProgramParameter(v11Program,gl.LINK_STATUS)){
 throw Error(gl.getProgramInfoLog(v11Program));
}
gl.useProgram(program);
const buffer=gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER,buffer);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([
 -1,-1,1,-1,-1,1,1,1
]),gl.STATIC_DRAW);
const position=gl.getAttribLocation(program,'position');
gl.enableVertexAttribArray(position);
gl.vertexAttribPointer(position,2,gl.FLOAT,false,0,0);

let uniforms={};
[
 'resolution','cameraPosition','cameraRight','cameraUp',
 'cameraForward','fov','radarTexture','distanceTexture',
 'shapeTexture','renderMode','shellVolume','coreVolume'
].forEach(name=>{
 uniforms[name]=gl.getUniformLocation(program,name);
});

const refinedUniforms=uniforms;
const v11Uniforms={};
Object.keys(uniforms).forEach(name=>{
 v11Uniforms[name]=gl.getUniformLocation(v11Program,name);
});

const texture=gl.createTexture();
const distanceTexture=gl.createTexture();
const shapeTexture=gl.createTexture();
const shellVolume=gl.createTexture();
const coreVolume=gl.createTexture();
gl.activeTexture(gl.TEXTURE0);
gl.bindTexture(gl.TEXTURE_2D,texture);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.NEAREST);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.NEAREST);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
gl.uniform1i(uniforms.radarTexture,0);

function radarColor(dbz){
 if(dbz>=45)return [237,66,200,255];
 if(dbz>=35)return [240,120,50,255];
 if(dbz>=30)return [244,212,62,255];
 if(dbz>=25)return [36,189,112,255];
 if(dbz>=15)return [57,126,232,255];
 return [0,0,0,0];
    }function uploadRadarMatrix(cell){
 const matrix=cell.grid_matrix;
 if(!Array.isArray(matrix)||matrix.length!==72){
  throw Error('Matrice DBZH 72×72 non disponibile');
 }
 const width=72,height=72;
 const pixels=new Uint8Array(width*height*4);
 for(let y=0;y<height;y++){
  const row=matrix[y]||[];
  if(!Array.isArray(row)||row.length!==72){
   throw Error('Riga matrice DBZH non valida');
  }
  for(let x=0;x<width;x++){
   const value=Number(row[x]);
   const rgba=radarColor(Number.isFinite(value)?value:0);
   const offset=(y*width+x)*4;
   pixels[offset]=rgba[0];
   pixels[offset+1]=rgba[1];
   pixels[offset+2]=rgba[2];
   pixels[offset+3]=rgba[3];
  }
 }

 const shape=new Uint8Array(width*height*4);
 const weights=[1,4,6,4,1];
 for(let y=0;y<height;y++)for(let x=0;x<width;x++){
  let total=0;
  for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++){
   const v=Number(matrix[y+dy]?.[x+dx])||0;
   total+=Math.max(0,v)*weights[dy+2]*weights[dx+2];
  }
  shape[(y*width+x)*4]=Math.round(Math.min(90,total/256)/90*255);
  shape[(y*width+x)*4+3]=255;
 }
 gl.activeTexture(gl.TEXTURE2);
 gl.bindTexture(gl.TEXTURE_2D,shapeTexture);
 gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
 gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
 gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
 gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
 gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,width,height,0,gl.RGBA,gl.UNSIGNED_BYTE,shape);
 gl.uniform1i(uniforms.shapeTexture,2);

 const distances=new Uint8Array(width*height*4);
 const seeds=[[],[]];
 for(let y=0;y<height;y++)for(let x=0;x<width;x++){
  const v=Number(matrix[y][x]);
  if(v>=15&&v<25)seeds[0].push([x,y]);  if(v>=25&&v<30)seeds[1].push([x,y]);
 }
 for(let y=0;y<height;y++)for(let x=0;x<width;x++){
  const offset=(y*width+x)*4;
  for(let k=0;k<2;k++){
   let best=width*width*2;
   for(const [sx,sy] of seeds[k]){
    best=Math.min(best,(x-sx)**2+(y-sy)**2);
   }
   distances[offset+k]=Math.round(Math.sqrt(best)/width/Math.SQRT2*255);
  }
  distances[offset+3]=255;
 }
 gl.activeTexture(gl.TEXTURE1);
 gl.bindTexture(gl.TEXTURE_2D,distanceTexture);
 gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
 gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
 gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
 gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
 gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,width,height,0,gl.RGBA,gl.UNSIGNED_BYTE,distances);
 gl.uniform1i(uniforms.distanceTexture,1);

 gl.activeTexture(gl.TEXTURE0);
 gl.bindTexture(gl.TEXTURE_2D,texture);
 gl.pixelStorei(gl.UNPACK_ALIGNMENT,1);
 gl.texImage2D(
  gl.TEXTURE_2D,0,gl.RGBA,width,height,0,
  gl.RGBA,gl.UNSIGNED_BYTE,pixels
 );
}

function uploadContinuousVolume(matrix){
 const n=64,w=72;
 const shells=new Uint8Array(n*n*n*4);
 const cores=new Uint8Array(n*n*n*4);
 const thresholds=[15,25,30,35,45];
 const smooth=(a,b,v)=>{
  const t=Math.max(0,Math.min(1,(v-a)/(b-a)));
  return t*t*(3-2*t);
 };
 const source=new Float64Array(w*w);
 for(let z=0;z<w;z++)for(let x=0;x<w;x++){
  const v=Number(matrix[z][x]);
  source[z*w+x]=Number.isFinite(v)&&v>=15?Math.min(80,v)**4:0;
 }
 const temp=new Float64Array(w*w),field=new Float64Array(w*w);
 const coordinates=Float64Array.from({length:n},(_,i)=>
  (((i+.5)/n*5.6-2.8+2.25)/4.5*w-.5));
 for(let y=1;y<n-1;y++){
  const h=(y+.5)/n*3.75,sigma=.9+1.8*h;
  const radius=Math.floor(4*sigma+.5);
  const kernel=new Float64Array(radius*2+1);
  let sum=0;
  for(let j=-radius;j<=radius;j++){
   const v=Math.exp(-.5*(j/sigma)**2);
   kernel[j+radius]=v;sum+=v;
  }
  for(let j=0;j<kernel.length;j++)kernel[j]/=sum;
  // Same zero-padded Gaussian filter as the approved visual prototype.
  for(let z=0;z<w;z++)for(let x=0;x<w;x++){
   let value=0;
   for(let j=-radius;j<=radius;j++){
    const row=z+j;
    if(row>=0&&row<w)value+=source[row*w+x]*kernel[j+radius];
   }
   temp[z*w+x]=value;
  }
  for(let z=0;z<w;z++)for(let x=0;x<w;x++){
   let value=0;
   for(let j=-radius;j<=radius;j++){
    const col=x+j;
    if(col>=0&&col<w)value+=temp[z*w+col]*kernel[j+radius];
   }
   field[z*w+x]=Math.sqrt(Math.sqrt(value));
  }
  for(let z=1;z<n-1;z++)for(let x=1;x<n-1;x++){
   const qx=coordinates[x],qz=coordinates[z];
   if(qx<0||qx>w-1||qz<0||qz>w-1)continue;
   const x0=Math.floor(qx),z0=Math.floor(qz);
   const x1=Math.min(w-1,x0+1),z1=Math.min(w-1,z0+1);
   const fx=qx-x0,fz=qz-z0;
   const lower=field[z0*w+x0]*(1-fx)+field[z0*w+x1]*fx;
   const upper=field[z1*w+x0]*(1-fx)+field[z1*w+x1]*fx;
   const dbz=lower*(1-fz)+upper*fz-h*14;
   const offset=((z*n+y)*n+x)*4;
   for(let k=0;k<5;k++){
    const density=smooth(thresholds[k]-3,thresholds[k]+3,dbz)*
     smooth(.04,k<2?.40:.12,h);
    if(k<4)shells[offset+k]=Math.round(density*255);
    else cores[offset]=Math.round(density*255);
   }
  }
 }
 for(const [unit,tex,data] of [[3,shellVolume,shells],[4,coreVolume,cores]]){
  gl.activeTexture(gl.TEXTURE0+unit);  gl.bindTexture(gl.TEXTURE_3D,tex);
  gl.texParameteri(gl.TEXTURE_3D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_3D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_3D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_3D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_3D,gl.TEXTURE_WRAP_R,gl.CLAMP_TO_EDGE);
  gl.texImage3D(gl.TEXTURE_3D,0,gl.RGBA8,n,n,n,0,gl.RGBA,gl.UNSIGNED_BYTE,data);
 }
 gl.activeTexture(gl.TEXTURE0);
}

let yaw=-.35;
let pitch=.34;
let distance=7.1;
let activeCell=null;
let dragging=false;
let lastX=0;
let lastY=0;
let pinchDistance=0;

function normalize(v){
 const length=Math.hypot(v[0],v[1],v[2])||1;
 return v.map(n=>n/length);
}
function cross(a,b){
 return [
  a[1]*b[2]-a[2]*b[1],
  a[2]*b[0]-a[0]*b[2],
  a[0]*b[1]-a[1]*b[0]
 ];
}

function resizeCanvas(){
 const rect=canvas.getBoundingClientRect();
 const ratio=Math.min(window.devicePixelRatio||1,1.35);
 canvas.width=Math.max(1,Math.round(rect.width*ratio));
 canvas.height=Math.max(1,Math.round(rect.height*ratio));
 gl.viewport(0,0,canvas.width,canvas.height);
}

function drawScene(){
 if(!activeCell||!viewer.classList.contains('open'))return;
 const width=canvas.width,height=canvas.height;
 if(!width||!height)return;
 gl.clearColor(.008,.018,.031,1);
 gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);

 const target=[0,.9,0];
 const cp=Math.cos(pitch),sp=Math.sin(pitch);
 const sy=Math.sin(yaw),cy=Math.cos(yaw);
 const camera=[
  distance*cp*sy,
  target[1]+distance*sp,
  distance*cp*cy
 ];
 const forward=normalize([
  target[0]-camera[0],
  target[1]-camera[1],
  target[2]-camera[2]
 ]);
 const right=normalize(cross(forward,[0,1,0]));
 const up=normalize(cross(right,forward));

 const mode=Number($('mode').value)||0;
 program=mode===0?v11Program:refinedProgram;
 uniforms=mode===0?v11Uniforms:refinedUniforms;
 gl.useProgram(program);
 gl.uniform1i(uniforms.radarTexture,0);
 gl.uniform1i(uniforms.distanceTexture,1);
 gl.uniform1i(uniforms.shapeTexture,2);
 gl.uniform1i(uniforms.shellVolume,3);
 gl.uniform1i(uniforms.coreVolume,4);
 gl.uniform2f(uniforms.resolution,width,height);
 gl.uniform3fv(uniforms.cameraPosition,camera);
 gl.uniform3fv(uniforms.cameraRight,right);
 gl.uniform3fv(uniforms.cameraUp,up);
 gl.uniform3fv(uniforms.cameraForward,forward);
 gl.uniform1f(uniforms.fov,Math.tan(32*Math.PI/180));
 gl.uniform1i(uniforms.renderMode,Number($('mode').value)||0);
 gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
}

function open3D(cell){
 if(cell['3d_available']!==true){
  alert('Questa cella non è inclusa nelle 30 selezionate per il 3D.');
  return;
 }
 try{
  activeCell=cell;
  uploadRadarMatrix(cell);
  uploadContinuousVolume(cell.grid_matrix);
  $('vtitle').textContent=
   (cell.track_id||cell.id||'CELLA')+
   ' · '+fmt(cell.max_dbz)+' dBZ';
  yaw=-.35;
  pitch=.34;
  distance=7.1;
  $('mode').value='0';
  viewer.classList.add('open');
  requestAnimationFrame(()=>{
   resizeCanvas();
   drawScene();
  });
 }catch(error){
  console.error(error);
  alert('Ricostruzione 3D: '+error.message);
 }
}

$('mode').onchange=drawScene;
$('close').onclick=()=>{
 viewer.classList.remove('open');
 activeCell=null;
};
$('reset').onclick=()=>{
 yaw=-.35;
 pitch=.34;
 distance=7.1;
 drawScene();
};
window.addEventListener('resize',()=>{
 if(viewer.classList.contains('open')){
  resizeCanvas();
  drawScene();
 }
});

canvas.addEventListener('pointerdown',event=>{
 dragging=true;
 lastX=event.clientX;
 lastY=event.clientY;
 if(canvas.setPointerCapture){
  canvas.setPointerCapture(event.pointerId);
 }
});
canvas.addEventListener('pointermove',event=>{
 if(!dragging)return;
 const dx=event.clientX-lastX;
 const dy=event.clientY-lastY;
 yaw-=dx*.006;
 pitch=Math.max(-.12,Math.min(1.12,pitch+dy*.004));
 lastX=event.clientX;
 lastY=event.clientY;
 drawScene();
});
function stopDragging(){dragging=false;}
canvas.addEventListener('pointerup',stopDragging);
canvas.addEventListener('pointercancel',stopDragging);
canvas.addEventListener('lostpointercapture',stopDragging);

canvas.addEventListener('wheel',event=>{
 event.preventDefault();
 distance=Math.max(4.0,Math.min(13,distance+event.deltaY*.008));
 drawScene();
},{passive:false});

canvas.addEventListener('touchstart',event=>{
 if(event.touches.length===2){
  pinchDistance=Math.hypot(
   event.touches[0].clientX-event.touches[1].clientX,
   event.touches[0].clientY-event.touches[1].clientY
  );
 }
},{passive:true});
canvas.addEventListener('touchmove',event=>{
 if(event.touches.length!==2)return;
 event.preventDefault();
 const next=Math.hypot(
  event.touches[0].clientX-event.touches[1].clientX,
  event.touches[0].clientY-event.touches[1].clientY
 );
 if(pinchDistance>0&&next>0){
  distance=Math.max(4.0,Math.min(13,distance*pinchDistance/next));
  drawScene();
 }
 pinchDistance=next;
},{passive:false});
canvas.addEventListener('touchend',()=>{
 pinchDistance=0;
},{passive:true});
})();
</script>
