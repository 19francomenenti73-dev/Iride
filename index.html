<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I.R.I.D.E. 3D - Solid Tomography Engine</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { background-color: #050811; color: #e2e8f0; font-family: monospace; overflow: hidden; height: 100vh; }
        #canvas-container { width: 100vw; height: 100vh; display: block; }
        
        /* BANNER TOP ANCORATO */
        .top-banner {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            background: rgba(10, 15, 30, 0.92);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(59, 130, 246, 0.4);
            padding: 10px 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.7);
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .banner-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .banner-title {
            font-size: 0.95rem;
            color: #60a5fa;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        .cell-badge {
            background: rgba(59, 130, 246, 0.2);
            border: 1px solid #3b82f6;
            color: #38bdf8;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
        }

        .metrics-bar {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            font-size: 0.7rem;
        }

        .metric-box {
            background: rgba(255, 255, 255, 0.04);
            padding: 4px 6px;
            border-radius: 4px;
            border-left: 2px solid #38bdf8;
        }

        .metric-label { color: #94a3b8; font-size: 0.6rem; }
        .metric-val { color: #fff; font-weight: bold; font-size: 0.85rem; }

        .controls-row {
            display: grid;
            grid-template-columns: 1fr 1.2fr 0.8fr;
            gap: 10px;
            align-items: center;
            font-size: 0.7rem;
        }

        .ctrl-item { display: flex; flex-direction: column; gap: 2px; }
        .ctrl-item label { color: #94a3b8; font-size: 0.65rem; }

        .btn-group { display: flex; gap: 4px; }
        button {
            flex: 1; background: #1e293b; color: #38bdf8; border: 1px solid #38bdf8;
            padding: 4px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 0.7rem;
        }
        button:hover { background: #38bdf8; color: #0f172a; }

        input[type=range] { width: 100%; accent-color: #38bdf8; }

        .legend-inline {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            font-size: 0.6rem;
            align-items: center;
        }
        .legend-item { display: flex; align-items: center; gap: 3px; }
        .dot { width: 6px; height: 6px; border-radius: 50%; }

        @media (max-width: 600px) {
            .metrics-bar { grid-template-columns: repeat(2, 1fr); }
            .controls-row { grid-template-columns: 1fr; gap: 6px; }
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <!-- BANNER ANCORATO IN ALTO -->
    <div class="top-banner">
        <div class="banner-header">
            <div class="banner-title">I.R.I.D.E. 3D TOMOGRAPHY</div>
            <div class="cell-badge" id="cell-id">CENTROIDE #CELL-8042</div>
        </div>

        <div class="metrics-bar">
            <div class="metric-box">
                <div class="metric-label">dBZ MAX</div>
                <div class="metric-val" style="color:#ff00aa" id="val-dbz">68.5 dBZ</div>
            </div>
            <div class="metric-box">
                <div class="metric-label">ECHO TOP</div>
                <div class="metric-val" id="val-top">11.4 km</div>
            </div>
            <div class="metric-box">
                <div class="metric-label">PARALLELEPIPEDI</div>
                <div class="metric-val" id="voxel-count">0</div>
            </div>
            <div class="metric-box">
                <div class="metric-label">OPACITÀ BASE</div>
                <div class="metric-val" id="opacity-val">70%</div>
            </div>
        </div>

        <div class="controls-row">
            <div class="ctrl-item">
                <label>Opacità Volumetrica (±10%)</label>
                <div class="btn-group">
                    <button onclick="adjustOpacity(-0.10)">- 10%</button>
                    <button onclick="adjustOpacity(0.10)">+ 10%</button>
                </div>
            </div>

            <div class="ctrl-item">
                <label>Sezione Tomografica RHI (Taglio XZ)</label>
                <input type="range" id="slice-slider" min="-30" max="30" value="30" step="0.5">
            </div>

            <div class="ctrl-item">
                <button onclick="regenerateCell()" style="height: 28px; margin-top: 10px;">Aggiorna Radar</button>
            </div>
        </div>

        <div class="legend-inline">
            <div class="legend-item"><div class="dot" style="background:#0055ff"></div> Blu</div>
            <div class="legend-item"><div class="dot" style="background:#00ff44"></div> Verde</div>
            <div class="legend-item"><div class="dot" style="background:#ffcc00"></div> Giallo</div>
            <div class="legend-item"><div class="dot" style="background:#ff2200"></div> Rosso</div>
            <div class="legend-item"><div class="dot" style="background:#ff00aa"></div> Mag.</div>
        </div>
    </div>

    <script>
        let scene, camera, renderer, controls;
        let stormContainer;

        const GRID_SIZE = 32;
        let radarMatrix = [];

        function generateSyntheticRadarMatrix() {
            radarMatrix = [];
            const center = GRID_SIZE / 2;
            for (let r = 0; r < GRID_SIZE; r++) {
                let row = [];
                for (let c = 0; c < GRID_SIZE; c++) {
                    let dist = Math.hypot(r - center, c - center);
                    let dbz = 0;
                    if (dist < 11) {
                        dbz = Math.max(0, 72 - (dist * 5.8) + (Math.random() * 4));
                    }
                    row.push(Math.round(dbz));
                }
                radarMatrix.push(row);
            }
        }

            camera.position.set(65, 30, 75);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.target.set(0, -5, 0);

            dirLight.position.set(40, 60, 40);
            scene.add(dirLight);

            setupMaterials();

            buildSolidTomographyFromRaster();
