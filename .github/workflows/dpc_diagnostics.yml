
name: IRIDE DPC Diagnostics

on:
  workflow_dispatch:
  schedule:
    - cron: "12,32,52 * * * *"

permissions:
  contents: write

concurrency:
  group: iride-radar-pipeline
  cancel-in-progress: false

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt

      - name: Run DPC diagnostics
        run: |
          python backend/dpc_diagnostics.py

      - name: Validate diagnostics output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path(
              "docs/data/dpc3d/diagnostics.json"
          )

          assert path.is_file(), (
              "Missing diagnostics JSON"
          )

          data = json.loads(
              path.read_text(encoding="utf-8")
          )

          assert data.get("source") == "Radar-DPC"
          assert data.get("license") == "CC BY-SA 4.0"

          products = data.get("products", {})
          assert isinstance(products, dict)

          for name in ("VIL", "ETM", "POH", "VMI"):
              assert name in products, (
                  f"Missing product: {name}"
              )

          print("DPC diagnostics JSON validated")
          print("Status:", data.get("status"))

          for name, item in products.items():
              print(
                  name,
                  item.get("status"),
                  item.get("timestamp", ""),
                  item.get("reason", "")
              )
          PY

      - name: Publish diagnostics
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/data/dpc3d/diagnostics.json

          if git diff --cached --quiet; then
            echo "Diagnostics unchanged."
            exit 0
          fi

          BASE_SHA=$(git rev-parse HEAD)

          git commit -m "Update IRIDE DPC diagnostics"

          git fetch origin main

          REMOTE_SHA=$(git rev-parse refs/remotes/origin/main)

          if [ "$REMOTE_SHA" != "$BASE_SHA" ]; then
            echo "::error::Concurrent update detected."
            echo "::error::Diagnostics NOT published."
            exit 1
          fi

          if git push origin HEAD:main; then
            echo "DPC diagnostics published."
            exit 0
          fi

          echo "::error::DPC publication failed."
          exit 1
          
