
name: IRIDE DPC Diagnostics

on:
  workflow_dispatch:
  schedule:
    - cron: "12,32,52 * * * *"

permissions:
  contents: write

concurrency:
  group: iride-radar-pipeline
  cancel-in-progress: false

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run DPC diagnostics
        run: |
          python backend/dpc_diagnostics.py

      - name: Validate diagnostic JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path(
              "docs/data/dpc3d/diagnostics.json"
          )

          if not path.is_file():
              raise SystemExit(
                  "ERRORE: diagnostics.json assente"
              )

          data = json.loads(
              path.read_text(encoding="utf-8")
          )

          assert data["source"] == "Radar-DPC"
          assert data["license"] == "CC BY-SA 4.0"

          products = data.get("products", {})
          assert isinstance(products, dict)

          for name in ("VIL", "ETM", "POH", "VMI"):
              assert name in products, name

          print("Diagnostica JSON valida")
          print("Stato:", data.get("status"))
          print("Radar:", data.get("radar_status"))
          print("Celle:", len(data.get("cells", {})))

          for name in ("VIL", "ETM", "POH", "VMI"):
              item = products[name]
              print(
                  name,
                  "status=", item.get("status"),
                  "unit=", item.get("unit"),
                  "sync=", item.get("cell_synchronized"),
                  "reason=", item.get("reason")
              )
          PY

      - name: Publish diagnostic JSON
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/data/dpc3d/diagnostics.json

          if git diff --cached --quiet; then
            echo "Nessuna modifica da pubblicare."
            exit 0
          fi

          git commit -m "Update IRIDE DPC diagnostics"

          for attempt in 1 2 3 4 5; do
            echo "Pubblicazione tentativo ${attempt}/5"

            git fetch origin main

            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::Conflitto durante il rebase."
              exit 1
            fi

            if git push origin HEAD:main; then
              echo "Diagnostica DPC pubblicata."
              exit 0
            fi

            echo "Repository aggiornato durante il push."
            sleep 5
          done

          echo "::error::Pubblicazione non riuscita."
          exit 1

      - name: Final status
        if: always()
        run: |
          echo "DPC diagnostics execution completed."
          echo "See previous steps for product status."
          
