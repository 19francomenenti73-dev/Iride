name: IRIDE DPC Diagnostics

on:
  workflow_dispatch:
  schedule:
    - cron: "7,27,47 * * * *"

permissions:
  contents: write

concurrency:
  group: iride-radar-pipeline
  cancel-in-progress: false

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt

      - name: Run DPC diagnostics
        run: |
          python backend/dpc_diagnostics.py

      - name: Publish diagnostics
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/data/dpc3d/diagnostics.json

          if git diff --cached --quiet; then
            echo "No diagnostics changes"
            exit 0
          fi

          git commit -m "Update IRIDE DPC diagnostics"

          BASE=$(git rev-parse HEAD^)
          git fetch origin main
          REMOTE=$(git rev-parse origin/main)

          if [ "$REMOTE" != "$BASE" ]; then
            echo "Concurrent update; skip publication"
            exit 0
          fi

          git push origin HEAD:main
          
