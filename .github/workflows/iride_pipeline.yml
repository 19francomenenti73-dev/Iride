
name: IRIDE - Radar Acquisition and Processing

on:
  workflow_dispatch:

  push:
    paths:
      - 'acquire_opera.py'
      - 'decode_opera.py'
      - 'engine.py'
      - 'data/iride_database.json'
      - '.github/workflows/iride.yml'

  schedule:
    - cron: '7,27,47 * * * *'

permissions:
  contents: write

concurrency:
  group: iride-main
  cancel-in-progress: false

jobs:
  iride:
    name: Acquire, Decode and Process
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify repository structure
        shell: bash
        run: |
          set -e

          echo "Repository root:"
          pwd

          echo "Checking required files..."

          test -f acquire_opera.py || {
            echo "::error::Manca acquire_opera.py nella radice di main"
            exit 1
          }

          test -f decode_opera.py || {
            echo "::error::Manca decode_opera.py nella radice di main"
            exit 1
          }

          test -f engine.py || {
            echo "::error::Manca engine.py nella radice di main"
            exit 1
          }

          echo "File Python trovati."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install processing dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy h5py pyproj

      - name: Create required directories
        run: |
          mkdir -p data
          mkdir -p data/raw
          mkdir -p docs/data

      - name: Acquire OPERA radar data
        run: python -u acquire_opera.py

      - name: Decode radar data
        run: python -u decode_opera.py

      - name: Process observations and calculate vectors
        run: python -u engine.py

      - name: Validate generated data
        shell: bash
        run: |
          set -e

          echo "Checking generated files..."

          test -s data/iride_database.json || {
            echo "::error::Manca data/iride_database.json o il file è vuoto"
            exit 1
          }

          test -s data/iride_history.json || {
            echo "::error::Manca data/iride_history.json o il file è vuoto"
            exit 1
          }

          test -s data/iride_output.json || {
            echo "::error::Manca data/iride_output.json o il file è vuoto"
            exit 1
          }

          test -s docs/data/iride.json || {
            echo "::error::Manca docs/data/iride.json o il file è vuoto"
            exit 1
          }

          python - <<'PY'
          import json
          from pathlib import Path

          files = [
              Path("data/iride_database.json"),
              Path("data/iride_history.json"),
              Path("data/iride_output.json"),
              Path("docs/data/iride.json"),
          ]

          for path in files:
              with path.open("r", encoding="utf-8") as f:
                  json.load(f)
              print(f"JSON valido: {path}")

          print("Controllo JSON completato.")
          PY

      - name: Commit updated data
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/iride_database.json \
            data/iride_history.json \
            data/iride_output.json \
            docs/data/iride.json

          if git diff --cached --quiet; then
            echo "Nessuna variazione nei dati: commit non necessario."
          else
            git commit -m "Update IRIDE radar observations"
            git push origin HEAD:main
          fi

      - name: Workflow summary
        if: always()
        shell: bash
        run: |
          {
            echo "## IRIDE - Execution summary"
            echo ""
            echo "- Branch: main"
            echo "- Acquisition script: acquire_opera.py"
            echo "- Decoder script: decode_opera.py"
            echo "- Processing engine: engine.py"
            echo ""
            echo "### Generated files"
            for file in \
              data/iride_database.json \
              data/iride_history.json \
              data/iride_output.json \
              docs/data/iride.json
            do
              if test -s "$file"; then
                echo "- OK: $file"
              else
                echo "- MISSING OR EMPTY: $file"
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
          
