
name: IRIDE - Radar Acquisition and Processing

on:
  workflow_dispatch:

  push:
    paths:
      - 'backend/**'
      - 'data/iride_database.json'
      - '.github/workflows/iride.yml'

  schedule:
    - cron: '7,27,47 * * * *'

permissions:
  contents: write

concurrency:
  group: iride-main
  cancel-in-progress: false

jobs:
  iride:
    name: Acquire, Decode and Process
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify repository structure
        shell: bash
        run: |
          set -e

          echo "Repository root:"
          pwd

          echo "Checking required files..."

          test -f backend/acquire_opera.py || {
            echo "::error::Manca backend/acquire_opera.py"
            exit 1
          }

          test -f backend/decode_opera.py || {
            echo "::error::Manca backend/decode_opera.py"
            exit 1
          }

          test -f backend/Iride_engine.py || {
            echo "::error::Manca backend/Iride_engine.py"
            exit 1
          }

          echo "Tutti e tre gli script sono presenti."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy h5py pyproj

      - name: Create output directories
        run: |
          mkdir -p data/raw
          mkdir -p docs/data

      - name: Acquire OPERA radar data
        run: python -u backend/acquire_opera.py

      - name: Decode radar data
        run: python -u backend/decode_opera.py

      - name: Process observations
        run: python -u backend/Iride_engine.py

      - name: Validate generated JSON
        shell: bash
        run: |
          set -e

          for file in \
            data/iride_database.json \
            data/iride_history.json \
            data/iride_output.json \
            docs/data/iride.json
          do
            if [ ! -s "$file" ]; then
              echo "::error::File mancante o vuoto: $file"
              exit 1
            fi

            python -m json.tool "$file" > /dev/null
            echo "JSON valido: $file"
          done

      - name: Commit updated data
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/iride_database.json \
            data/iride_history.json \
            data/iride_output.json \
            docs/data/iride.json

          if git diff --cached --quiet; then
            echo "Nessuna variazione nei dati."
          else
            git commit -m "Update IRIDE radar observations"
            git push origin HEAD:main
          fi

      - name: Execution summary
        if: always()
        shell: bash
        run: |
          {
            echo "## IRIDE execution"
            echo ""
            echo "Branch: main"
            echo "Scripts directory: backend/"
            echo "Engine: Iride_engine.py"
          } >> "$GITHUB_STEP_SUMMARY"
          
