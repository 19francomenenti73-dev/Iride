
name: IRIDE Radar Acquisition and Engine

on:
  workflow_dispatch:

  push:
    paths:
      - 'backend/**'
      - 'data/iride_database.json'
      - '.github/workflows/iride.yml'

  schedule:
    # Esecuzione ogni 20 minuti.
    - cron: '7,27,47 * * * *'

permissions:
  contents: write

concurrency:
  group: iride-radar-engine
  cancel-in-progress: false

jobs:
  acquire-process-publish:
    name: Acquire, Process and Publish
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install decoding dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install h5py numpy

      - name: Check acquisition module
        run: |
          test -f backend/acquire_opera.py || {
            echo "::error::Manca backend/acquire_opera.py"
            exit 1
          }

      - name: Acquire OPERA radar data
        id: acquire
        continue-on-error: true
        run: |
          python backend/acquire_opera.py

      - name: Report acquisition status
        if: always()
        env:
          ACQUIRE_OUTCOME: ${{ steps.acquire.outcome }}
        run: |
          echo "Acquisizione OPERA: ${ACQUIRE_OUTCOME}"

          if [ "${ACQUIRE_OUTCOME}" != "success" ]; then
            echo "::warning::Acquisizione non riuscita. Non considerare aggiornati i dati radar."
          fi

      - name: Check for usable input database
        id: input
        run: |
          if [ -f data/iride_database.json ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Process existing database
        if: steps.input.outputs.available == 'true'
        run: |
          python backend/engine.py

      - name: Validate generated JSON
        if: steps.input.outputs.available == 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          files = [
              Path("data/iride_output.json"),
              Path("docs/data/iride.json"),
              Path("data/iride_history.json"),
          ]

          for path in files:
              if not path.is_file():
                  raise SystemExit(f"Output mancante: {path}")

              with path.open(encoding="utf-8") as f:
                  data = json.load(f)

              if not isinstance(data, dict):
                  raise SystemExit(f"JSON non valido: {path}")

          with Path("docs/data/iride.json").open(encoding="utf-8") as f:
              public = json.load(f)

          if not isinstance(public.get("cells"), list):
              raise SystemExit("Output pubblico privo dell'array cells")

          print("Validazione JSON completata.")
          print("Celle pubblicate:", len(public["cells"]))
          print("Timestamp:", public.get("timestamp"))
          PY

      - name: Publish generated JSON
        if: steps.input.outputs.available == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/iride_history.json \
            data/iride_output.json \
            docs/data/iride.json

          if git diff --cached --quiet; then
            echo "Nessuna modifica ai JSON generati."
            exit 0
          fi

          git commit -m "Update IRIDE processed radar data"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Summary
        if: always()
        env:
          ACQUIRE_OUTCOME: ${{ steps.acquire.outcome }}
          INPUT_AVAILABLE: ${{ steps.input.outputs.available }}
        run: |
          {
            echo "## I.R.I.D.E. — Report"
            echo ""
            echo "- Acquisizione OPERA: ${ACQUIRE_OUTCOME}"
            echo "- Database preesistente: ${INPUT_AVAILABLE}"
            echo "- Decodifica HDF5: non implementata in questo workflow"
            echo "- Segmentazione radar DBZH: non implementata in questo workflow"
            echo ""
            echo "Un workflow verde non certifica che i dati pubblicati siano aggiornati."
          } >> "$GITHUB_STEP_SUMMARY"
          
