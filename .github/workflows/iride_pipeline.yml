
name: IRIDE Radar Pipeline

on:
  workflow_dispatch:

  push:
    paths:
      - 'backend/**'
      - 'data/iride_database.json'
      - '.github/workflows/iride.yml'

  schedule:
    - cron: '7,27,47 * * * *'

permissions:
  contents: write

concurrency:
  group: iride-radar-pipeline
  cancel-in-progress: false

jobs:
  radar-pipeline:
    name: Acquire, Decode, Track and Publish
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy h5py pyproj

      - name: Verify required files
        run: |
          test -f backend/acquire_opera.py || {
            echo "::error::Manca backend/acquire_opera.py"
            exit 1
          }

          test -f backend/decode_opera.py || {
            echo "::error::Manca backend/decode_opera.py"
            exit 1
          }

          test -f backend/engine.py || {
            echo "::error::Manca backend/engine.py"
            exit 1
          }

          mkdir -p data/raw docs/data

      - name: Acquire OPERA radar product
        id: acquire
        run: python backend/acquire_opera.py

      - name: Decode ODIM HDF5
        id: decode
        run: python backend/decode_opera.py

      - name: Verify decoded database
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/iride_database.json")

          if not path.is_file():
              raise SystemExit("Database decodificato assente")

          with path.open(encoding="utf-8") as f:
              data = json.load(f)

          if not isinstance(data, dict):
              raise SystemExit("Il database non è un oggetto JSON")

          if not isinstance(data.get("cells"), list):
              raise SystemExit("Il database non contiene cells")

          timestamp = data.get("timestamp")
          if not timestamp:
              raise SystemExit("Timestamp del prodotto assente")

          print("Database decodificato valido")
          print("Timestamp:", timestamp)
          print("Celle individuate:", len(data["cells"]))
          PY

      - name: Run tracking engine
        id: engine
        run: python backend/engine.py

      - name: Validate public output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          required = [
              Path("data/iride_output.json"),
              Path("data/iride_history.json"),
              Path("docs/data/iride.json"),
          ]

          for path in required:
              if not path.is_file():
                  raise SystemExit(f"File di output mancante: {path}")

              with path.open(encoding="utf-8") as f:
                  payload = json.load(f)

              if not isinstance(payload, dict):
                  raise SystemExit(f"JSON non valido: {path}")

          with Path("docs/data/iride.json").open(encoding="utf-8") as f:
              public = json.load(f)

          if not isinstance(public.get("cells"), list):
              raise SystemExit("Output pubblico privo di cells")

          print("Output pubblico valido")
          print("Timestamp:", public.get("timestamp"))
          print("Celle pubblicate:", len(public["cells"]))
          PY

      - name: Publish generated JSON
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/iride_database.json \
            data/iride_history.json \
            data/iride_output.json \
            docs/data/iride.json

          if git diff --cached --quiet; then
            echo "Nessuna modifica da pubblicare."
            exit 0
          fi

          git commit -m "Update IRIDE radar data"
          git push origin "HEAD:${BRANCH_NAME}"

      - name: Pipeline summary
        if: always()
        env:
          ACQUIRE_RESULT: ${{ steps.acquire.outcome }}
          DECODE_RESULT: ${{ steps.decode.outcome }}
          ENGINE_RESULT: ${{ steps.engine.outcome }}
        run: |
          {
            echo "## I.R.I.D.E. — Pipeline report"
            echo ""
            echo "- Acquisizione: ${ACQUIRE_RESULT}"
            echo "- Decoder: ${DECODE_RESULT}"
            echo "- Motore: ${ENGINE_RESULT}"
            echo ""
            echo "Un'esecuzione riuscita non certifica da sola la qualità meteorologica dei risultati."
          } >> "$GITHUB_STEP_SUMMARY"
          
