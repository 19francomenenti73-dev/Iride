name: I.R.I.D.E. radar nowcasting

on:
  workflow_dispatch:
  schedule:
    - cron: "*/20 * * * *"
  push:
    branches: [main]
    paths:
      - "backend/iride_pipeline.py"
      - ".github/workflows/iride_pipeline.yml"
      - "requirements.txt"

permissions:
  contents: write

concurrency:
  group: iride-radar-pipeline
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Acquire, decode, detect and track OPERA
        run: python backend/iride_pipeline.py

      - name: Compile backend
        run: python -m py_compile backend/iride_pipeline.py

      - name: Validate generated JSON
        run: |
          python -m json.tool data/iride.json >/dev/null
          python -m json.tool docs/data/iride.json >/dev/null
          python -m json.tool data/status.json >/dev/null

      - name: Validate radar, detections and vectors
        run: |
          python - <<'PY'
          import json
          import math
          from pathlib import Path

          data = json.loads(
              Path("data/iride.json").read_text(encoding="utf-8")
          )
          public = json.loads(
              Path("docs/data/iride.json").read_text(encoding="utf-8")
          )
          status = json.loads(
              Path("data/status.json").read_text(encoding="utf-8")
          )

          assert data == public, "JSON interno e pubblico non coincidono"
          assert data["status"] == "ok"
          assert data["schema_version"] == 6
          assert status["status"] == "ok"

          expected_region = {
              "west": -15.0,
              "east": 38.0,
              "south": 30.0,
              "north": 72.0,
          }
          assert data["region"] == expected_region

          radar = Path("docs/data/iride_radar.png")
          assert radar.is_file(), "Overlay radar assente"
          assert radar.stat().st_size > 1000, "Overlay radar vuoto"
          assert radar.read_bytes()[:8] == bytes(
              (137, 80, 78, 71, 13, 10, 26, 10)
          ), "Firma PNG non valida"

          overlay = data["radar_overlay"]
          assert overlay["image"] == "data/iride_radar.png"
          assert overlay["width"] == 720
          assert overlay["height"] == 1007
          assert len(overlay["bounds"]) == 2

          for corner in overlay["bounds"]:
              assert len(corner) == 2
              assert all(math.isfinite(float(v)) for v in corner)

          cells = data["cells"]
          assert 1 <= len(cells) <= 100
          assert data["cell_count"] == len(cells)
          assert status["cell_count"] == len(cells)

          track_ids = set()
          count_3d = 0
          vector_count = 0

          for cell in cells:
              assert cell["max_dbz"] >= data["processing"]["threshold_dbz"]
              assert -90 <= cell["lat"] <= 90
              assert -180 <= cell["lon"] <= 180

              track_id = cell["track_id"]
              assert track_id not in track_ids, "Track ID duplicato"
              track_ids.add(track_id)

              matrix = cell["grid_matrix"]
              assert len(matrix) == 72
              assert all(len(row) == 72 for row in matrix)

              for row in matrix:
                  for value in row:
                      assert isinstance(value, (int, float))
                      assert math.isfinite(value)

              assert cell["morphology"]["class"]
              assert cell["perimeter_semantics"]

              if cell["3d_available"]:
                  count_3d += 1
                  assert cell["3d_rank"] is not None
              else:
                  assert cell["3d_rank"] is None

              vectors = cell["vectors"]
              real = vectors["real"]
              forecast = vectors["predictive_180m"]

              if real is not None or forecast is not None:
                  vector_count += 1

                  observations = cell["track"]["observations"]
                  assert len(observations) >= 3
                  assert real is not None and len(real) == 2
                  assert forecast is not None and len(forecast) == 2

                  assert (
                      cell["track"]["forecast_status"]
                      == "experimental_consistent_motion_extrapolation"
                  )
                  assert (
                      vectors["forecast_status"]
                      == cell["track"]["forecast_status"]
                  )

                  assert real[1] == forecast[0]

                  for name in (
                      "real",
                      "predictive_30m",
                      "predictive_60m",
                      "predictive_180m",
                  ):
                      vector = vectors[name]
                      assert vector is not None and len(vector) == 2

                      for point in vector:
                          assert len(point) == 2
                          assert all(
                              math.isfinite(float(v)) for v in point
                          )

          assert count_3d == min(len(cells), 30)

          print(
              f"Validazione superata: {len(cells)} celle, "
              f"{count_3d} celle 3D, "
              f"{vector_count} celle con vettori, "
              f"PNG radar {radar.stat().st_size} byte"
          )
          PY

      - name: Commit generated radar data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/iride.json \
            data/iride_history.json \
            data/status.json \
            docs/data/iride.json \
            docs/data/iride_radar.png

          if git diff --cached --quiet; then
            echo "No new data changes."
          else
            git commit -m "Update I.R.I.D.E. OPERA radar data"
            git push
          fi
          
