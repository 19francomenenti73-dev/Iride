
name: I.R.I.D.E. radar nowcasting

on:
  workflow_dispatch:
  schedule:
    - cron: "*/20 * * * *"
  push:
    branches: [main]
    paths:
      - "backend/iride_pipeline.py"
      - ".github/workflows/iride_pipeline.yml"
      - "requirements.txt"

permissions:
  contents: write

concurrency:
  group: iride-radar-pipeline
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Compile backend before execution
        run: |
          python -m py_compile backend/iride_pipeline.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Acquire decode detect and track OPERA
        id: pipeline
        run: |
          python backend/iride_pipeline.py

      - name: Validate generated radar data
        id: validation
        run: |
          python - <<'PY'
          import json
          import math
          import struct
          from pathlib import Path

          internal = Path("data/iride.json")
          public = Path("docs/data/iride.json")
          status_file = Path("data/status.json")
          radar_file = Path("docs/data/iride_radar.png")

          for path in (
              internal, public, status_file, radar_file
          ):
              assert path.is_file(), f"Missing: {path}"

          data = json.loads(
              internal.read_text(encoding="utf-8")
          )
          published = json.loads(
              public.read_text(encoding="utf-8")
          )
          status = json.loads(
              status_file.read_text(encoding="utf-8")
          )

          assert data == published
          assert data["schema_version"] == 6
          assert data["status"] == "ok"
          assert status["status"] == "ok"

          assert data["region"] == {
              "west": -15.0,
              "east": 38.0,
              "south": 30.0,
              "north": 72.0,
          }

          raw = radar_file.read_bytes()
          assert len(raw) > 1000
          assert raw[:8] == bytes(
              (137, 80, 78, 71, 13, 10, 26, 10)
          )

          width, height = struct.unpack(
              ">II", raw[16:24]
          )
          assert (width, height) == (720, 1007)

          overlay = data["radar_overlay"]
          assert overlay["image"] == "data/iride_radar.png"
          assert overlay["width"] == width
          assert overlay["height"] == height
          assert len(overlay["bounds"]) == 2

          for corner in overlay["bounds"]:
              assert len(corner) == 2
              assert all(
                  math.isfinite(float(x)) for x in corner
              )

          cells = data["cells"]
          assert 1 <= len(cells) <= 100
          assert data["cell_count"] == len(cells)
          assert status["cell_count"] == len(cells)

          track_ids = set()
          count_3d = 0
          count_vectors = 0

          for cell in cells:
              assert math.isfinite(float(cell["lat"]))
              assert math.isfinite(float(cell["lon"]))
              assert cell["max_dbz"] >= 25

              track_id = cell["track_id"]
              assert track_id not in track_ids
              track_ids.add(track_id)

              matrix = cell["grid_matrix"]
              assert len(matrix) == 72

              for row in matrix:
                  assert len(row) == 72
                  assert all(
                      isinstance(v, (int, float))
                      and math.isfinite(v)
                      for v in row
                  )

              perimeter = cell["perimeter"]
              assert len(perimeter) == 4, (
                  "Expected four oriented corners"
              )

              for point in perimeter:
                  assert len(point) == 2
                  assert all(
                      math.isfinite(float(v))
                      for v in point
                  )

              assert cell["morphology"]["class"]
              assert cell["mesoscale_classification"]["class"]
              assert (
                  cell["mesoscale_classification"]
                      ["confirmed"] is False
              )

              if cell["3d_available"]:
                  count_3d += 1
                  assert cell["3d_rank"] is not None
              else:
                  assert cell["3d_rank"] is None

              vectors = cell["vectors"]
              real = vectors["real"]
              future = vectors["predictive_180m"]

              if real is not None or future is not None:
                  count_vectors += 1
                  assert real is not None
                  assert future is not None
                  assert len(
                      cell["track"]["observations"]
                  ) >= 3

                  for name in (
                      "real",
                      "predictive_30m",
                      "predictive_60m",
                      "predictive_180m",
                  ):
                      vector = vectors[name]
                      assert vector is not None
                      assert len(vector) == 2

                      for point in vector:
                          assert len(point) == 2
                          assert all(
                              math.isfinite(float(v))
                              for v in point
                          )

                  assert real[1] == future[0]

          assert count_3d == min(len(cells), 30)

          print(
              f"IRIDE VALID: {len(cells)} cells; "
              f"{count_3d} 3D; "
              f"{count_vectors} motion vectors; "
              f"radar {len(raw)} bytes"
          )
          PY

      - name: Commit validated data or failure status
        if: always() && steps.pipeline.outcome != 'skipped'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -f data/status.json ]; then
            git add data/status.json
          fi

          if [ "${{ steps.pipeline.outcome }}" = "success" ] && \
             [ "${{ steps.validation.outcome }}" = "success" ]; then
            git add \
              data/iride.json \
              data/iride_history.json \
              docs/data/iride.json \
              docs/data/iride_radar.png
          fi

          if git diff --cached --quiet; then
            echo "No changes to publish."
          else
            git commit -m "Update I.R.I.D.E. radar state"
            git push
          fi
          
