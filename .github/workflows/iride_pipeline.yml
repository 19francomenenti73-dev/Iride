
name: I.R.I.D.E. volume

on:
  workflow_dispatch:
  push:
    paths:
      - 'data/source.h5'
      - 'backend/iride_engine.py'
      - 'requirements.txt'
      - '.github/workflows/iride.yml'

permissions:
  contents: write

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build real radar matrix
        run: |
          python backend/iride_engine.py \
            --input data/source.h5 \
            --output docs/data/iride.json

      - name: Publish generated JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/iride.json
          if ! git diff --cached --quiet; then
            git commit -m "Update I.R.I.D.E. volume data"
            git push
          fi
          
