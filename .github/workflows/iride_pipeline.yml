name: I.R.I.D.E. radar nowcasting

on:
  workflow_dispatch:
  schedule:
    - cron: "*/20 * * * *"
  push:
    branches: [main]
    paths:
      - "backend/iride_pipeline.py"
      - ".github/workflows/iride_pipeline.yml"
      - "requirements.txt"

permissions:
  contents: write

concurrency:
  group: iride-radar-pipeline
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Acquire, decode, detect and track OPERA
        run: python backend/iride_pipeline.py

      - name: Validate published JSON
        run: |
          python -m json.tool data/iride.json >/dev/null
          python -m json.tool docs/data/iride.json >/dev/null
          python -c "import json; d=json.load(open('docs/data/iride.json')); assert d['status']=='ok' and d['cell_count']==len(d['cells'])"

      - name: Commit data and history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/iride.json data/iride_history.json data/status.json docs/data/iride.json
          if git diff --cached --quiet; then
            echo "No new data changes."
          else
            git commit -m "Update I.R.I.D.E. OPERA nowcasting data"
            git push
          fi
